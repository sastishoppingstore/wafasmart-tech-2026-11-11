*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Nastaliq Urdu","Noto Sans Arabic",Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:270px;background:var(--nav);color:#eaf1f8;position:fixed;right:0;top:0;bottom:0;overflow:auto;z-index:20;padding:20px 14px}.brand{display:flex;gap:12px;align-items:center;padding:7px 8px 20px;border-bottom:1px solid #ffffff18}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#11b981,#08714f);display:grid;place-items:center;font-size:23px}.brand b{display:block;font-size:15px}.brand small{color:#9fb0c1;font-size:11px}.nav-label{font-size:10px;color:#8094a8;padding:20px 12px 7px;letter-spacing:.8px}.nav-item{width:100%;border:0;background:transparent;color:#c7d3df;text-align:right;padding:10px 12px;border-radius:9px;display:flex;gap:10px;align-items:center;font-size:13px;margin:2px 0}.nav-item:hover,.nav-item.active{background:#1b354b;color:#fff}.nav-item.active{box-shadow:inset -3px 0 #16bd87}.nav-item .ico{width:21px;text-align:center;font-size:16px}.main{margin-right:270px;width:calc(100% - 270px);min-width:0}.topbar{height:72px;background:#ffffffed;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}.top-left,.top-right{display:flex;align-items:center;gap:12px}.search{width:min(340px,34vw);position:relative}.search input{width:100%;border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:10px 38px 10px 12px;outline:none}.search span{position:absolute;right:13px;top:9px;color:#8b98a8}.top-btn{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 12px;color:#405166}.avatar{width:36px;height:36px;border-radius:50%;background:#dff5eb;color:#08764f;display:grid;place-items:center;font-weight:bold}.content{paddin size:11px;margin-top:30px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-left:5px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}.table th{text-align:right;color:#718096;font-weight:600;background:#f8fafc}.table th,.table td{padding:12px 11px;border-bottom:1px solid var(--line)}.table tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:20px;padding:4px 9px;font-size:10px;background:#e9f7f0;color:#087c59}.pill.warn{background:#fff5df;color:#a66b0c}.pill.red{background:#fff0f0;color:#c23e46}.pill.blue{background:#edf3ff;color:#3568c9}.activity{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.activity:last-child{border:0}.activity .bullet{width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:5px;flex:none}.activity small{display:block;color:var(--muted);margin-top:4px}.module-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.module-card{display:flex;align-items:center;gap:12px;text-align:right;border:1px solid var(--line);background:white;padding:15px;border-radius:12px;color:var(--ink)}.module-card:hover{border-color:#83cdb1;transform:translateY(-1px)}.module-icon{width:40px;height:40px;border-radius:11px;background:#eef8f3;display:grid;place-items:center;font-size:19px}.module-card b{font-size:13px;display:block}.module-card small{font-size:10px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.field label{display:block;font-size:11px;color:#657487;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none;color:var(--ink);font-size:12px}.field input:focus,.field select:focus,.field textarea:focus{border-color:#54b997;box-shadow:0 0 0 3px #07966a12}.field.full{grid-column:1/-1}.form-actions{display:flex;gap:8px;margin-top:16px}.notice{background:#fff8e8;border:1px solid #f3dfb4;color:#805b18;padding:12px 14px;border-radius:10px;font-size:12px;line-height:1.8;margin-bottom:16px}.empty{padding:35px;text-align:center;color:var(--muted)}.mobile-menu{display:none}.footer{padding:20px 0;color:#91a0af;font-size:10px;text-align:center}.toast{position:fixed;bottom:20px;left:20px;background:#102638;color:white;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:50;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.modal-bg{position:fixed;inset:0;background:#0b172488;display:none;align-items:center;justify-content:center;z-index:40;padding:15px}.modal-bg.show{display:flex}.modal{background:white;border-radius:16px;width:min(680px,100%);max-height:90vh;overflow:auto;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{border:0;background:#f0f3f6;border-radius:8px;padding:6px 10px}.small-muted{font-size:10px;color:var(--muted)}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.module-grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:720px){.sidebar{transform:translateX(100%);transition:.25s;width:275px}.sidebar.open{transform:translateX(0)}.main{margin-right:0;width:100%}.topbar{padding:0 14px;height:62px}.content{padding:18px 13px}.page-head{display:block}.page-head .actions{margin-top:14px}.search{width:43vw}.top-btn.hide-mobile{display:none}.stats{gap:9px}.card{padding:13px}.stat-value{font-size:20px}.module-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr 1fr}.mobile-menu{display:inline-block}.page-head h1{font-size:21px}}

<body>
<div class="app">
<aside class="sidebar" id="sidebar">

 <div class="nav-label">مین مینو / MAIN</div>

<main class="main">
<header class="topbar"><div class="top-left"><button class="top-btn mobile-menu" onclick="toggleMenu()">☰</button><div><b id="topTitle">ڈیش بورڈ</b><div class="small-muted">مقصود چوک، تحصیل کروڑ، ضلع لیہ</div></div></div><div class="top-right"><div class="search"><span>⌕</span><input id="globalSearch" placeholder="ریکارڈ تلاش کریں..."></div><button class="top-btn hide-mobile" onclick="showToast('تمام ڈیٹا تازہ ترین ہے')">↻ Sync</button><button class="top-btn" onclick="showToast('کوئی نئی اطلاع نہیں')">♧</button><div class="avatar">SK</div></div></header>
<div class="content" id="content"></div>
</main></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><b id="modalTitle">نیا ریکارڈ</b><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const modules=[
["ڈیش بورڈ","dashboard","▦","لائیو بزنس سمری"],["اونر کنٹرول پینل","owner","♛","مکمل نگرانی"],["اسٹیشن سیٹنگز","settings","⚙","برانچ اور کاروباری معلومات"],
["فیول مصنوعات","products","◈","پیٹرول، ڈیزل، ریٹس"],["ٹینک مینجمنٹ","tanks","▤","گنجائش، اسٹاک، ڈِپ"],["ٹینک ڈِپ ریکارڈ","dip","◉","روزانہ پیمائش"],["مشین مینجمنٹ","machines","▥","ڈسپنسر مشینیں"],["نوزل مینجمنٹ","nozzles","⛽","میٹر اور سیل"],["نوزل سیل رپورٹ","nozzleReport","▧","نوزل وائز حساب"],
["سپلائرز / OMC","suppliers","♧","کمپنی اور لیجر"],["ٹینکر مینجمنٹ","deliveries","🚛","فیول ڈیلیوری"],["فیول وصولی","receiving","↓","ڈِپ سے تصدیق"],["پرچیز انوائس","purchase","▤","خریداری اور ادائیگی"],
["شفٹ مینجمنٹ","shifts","◷","اوپننگ / کلوزنگ"],["کیشئر مینجمنٹ","cash","▣","کیش اور ذمہ داری"],["کیش ہینڈ اوور","handover","⇄","رقم کی منتقلی"],["کیش ڈراور","drawer","▣","کیش اِن / آؤٹ"],
["بینک اکاؤنٹس","bank","▥","بینک بیلنس"],["بینک ڈپازٹ","deposits","↑","سلپ اور تصدیق"],["کیش بک","cashbook","▤","روزانہ کیش"],["اکاؤنٹنگ / جنرل لیجر","accounting","▧","ڈبل انٹری"],["اخراجات","expenses","↘","ہر خرچے کا ریکارڈ"],["منافع و نقصان","profit","⌁","P&L اور بیلنس شیٹ"],["مالک کی سرمایہ کاری","capital","♙","سرمایہ / نکاسی"],
["کسٹمرز","customers","♙","کسٹمر پروفائل"],["ادھار سیل","credit","⇢","کریڈٹ لین دین"],["ریکوری","recovery","✓","وصولی اور بقایا"],["گاڑی / فلیٹ اکاؤنٹس","fleet","▰","کارپوریٹ کسٹمر"],
["ملازمین","staff","♧","اسٹاف پروفائل"],["حاضری","attendance","◷","ان / آؤٹ"],["تنخواہ","salary","＄","پے رول"],["کارکردگی","performance","▥","ملازم رپورٹ"],
["آئل شاپ انوینٹری","inventory","▦","مصنوعات کا اسٹاک"],["POS سیل","pos","▣","بارکوڈ / رسید"],["اسٹاک ایڈجسٹمنٹ","stock","⇅","اسٹاک اِن / آؤٹ"],
["روزانہ سیل رپورٹ","reports","▥","روزانہ اور ماہانہ"],["اسٹاک ریکنسیلی ایشن","reconcile","◉","متوقع بمقابلہ اصل"],["کیش / بینک رپورٹ","financeReports","▧","کیش اور بینک"],["سالانہ رپورٹس","annual","▥","ٹرینڈ اور موازنہ"],
["یوزر مینجمنٹ","users","♙","اکاؤنٹس اور رولز"],["رولز / اجازتیں","roles","♜","اختیارات"],["آڈٹ ٹریل","audit","◷","ہر تبدیلی کا ریکارڈ"],["اپروول ورک فلو","approvals","✓","منظوری کا نظام"],["بیک اپ / ریکوری","backup","⟳","ڈیٹا تحفظ"],
["ہارڈویئر انٹیگریشن","hardware","⌘","ATG / ڈسپنسر"],["اسمارٹ الرٹس","alerts","♧","خودکار تنبیہات"],["نوٹیفکیشن سینٹر","notifications","✉","SMS / WhatsApp"],["آف لائن POS سنک","offline","⇄","انٹرنیٹ کے بغیر"],["دستاویزات","documents","▤","انوائس / رسید"],
["فیول کوالٹی ٹیسٹ","quality","◉","کوالٹی ریکارڈ"],["مرمت و مینٹیننس","maintenance","⚒","مشین / جنریٹر"],["سیفٹی / کمپلائنس","safety","✚","فائر / انسپیکشن"],["شکایات","complaints","☏","کسٹمر شکایت"],["لائلٹی پروگرام","loyalty","☆","پوائنٹس / ریوارڈ"],["ریٹ ہسٹری","priceHistory","↗","قیمت کی تبدیلی"],["اونر موبائل پورٹل","mobile","▣","موبائل PWA"],["ایڈوانس سرچ","search","⌕","تمام ریکارڈ"],["ٹیکس / انوائس","tax","▤","ٹیکس ریکارڈ"],["ڈیجیٹل دستخط","signature","✎","OTP / منظوری"],["کسٹمر ویب سائٹ","website","◎","پبلک ویب"],["کسٹمر پورٹل","portal","♙","اکاؤنٹ / اسٹیٹمنٹ"],["فلیٹ پورٹل","fleetPortal","▰","گاڑیوں کی رپورٹس"],["ویب سائٹ CMS","cms","▤","مواد / SEO"]
];
let records=JSON.parse(localStorage.getItem('skfs_records')||'{"nozzles":[],"tanks":[],"deliveries":[],"expenses":[],"bank":[],"customers":[],"shifts":[],"staff":[],"inventory":[]}');
let current='dashboard';
const money=n=>'Rs. '+Number(n||0).toLocaleString('en-PK');
function save(){localStorage.setItem('skfs_records',JSON.stringify(records))}
function showToast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2400)}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
function setPage(p){current=p;document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===p));let m=modules.find(x=>x[1]===p);document.getElementById('topTitle').textContent=m?m[0]:'ڈیش بورڈ';render();document.getElementById('sidebar').classList.remove('open')}
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function pageHead(title,sub,actions=''){return `<div class="page-head"><div><div class="eyebrow">SARWAR KHAN FILLING STATION / ERP</div><h1>${title}</h1><div class="sub">${sub||'تمام کاروباری سرگرمیوں کا مرکزی ریکارڈ'}</div></div><div class="actions">${actions}</div></div>`}
function stat(label,value,icon,foot='آج کا ریکارڈ'){return `<div class="card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function table(headers,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}" class="empty">ابھی کوئی ریکارڈ موجود نہیں۔ نیا ریکارڈ شامل کریں۔</td></tr>`}</tbody></table></div>`}
function dash(){let totalNozzle=records.nozzles.reduce((a,x)=>a+Number(x.amount||0),0),exp=records.expenses.reduce((a,x)=>a+Number(x.amount||0),0),dep=records.bank.reduce((a,x)=>a+Number(x.amount||0),0);return pageHead('اسٹیشن ڈیش بورڈ','آج کی کارکردگی، سیل، کیش، اسٹاک اور الرٹس',`<button class="btn" onclick="openRecord('nozzles')">＋ نوزل سیل درج کریں</button><button class="btn secondary" onclick="openRecord('expenses')">＋ خرچہ درج کریں</button>`)+
`<div class="grid stats">${stat('آج کی درج شدہ نوزل سیل',money(totalNozzle),'⛽','ڈیمو / دستی انٹری')}${stat('بینک ڈپازٹ',money(dep),'▥','درج شدہ ڈپازٹس')}${stat('آج کے اخراجات',money(exp),'↘','درج شدہ اخراجات')}${stat('ریکارڈز کی تعداد',Object.values(records).reduce((a,x)=>a+x.length,0),'▦','تمام ماڈیولز')}</div>
<div class="grid two"><div class="card"><div class="section-title"><h3>سیل کی کارکردگی</h3><small>نمونہ گراف • اصل ڈیٹا انٹری کے بعد</small></div><div class="chart">${[42,65,50,82,60,92,72].map((v,i)=>`<div class="bar-wrap"><div class="bar" style="height:${v}%"></div><span class="bar-label">${['پیر','منگل','بدھ','جمعرات','جمعہ','ہفتہ','اتوار'][i]}</span></div>`).join('')}</div><div class="legend"><span><i class="dot"></i>سیل انڈیکیٹر</span><span>گراف فی الحال ڈیمو ویلیوز دکھاتا ہے</span></div></div>
<div class="card"><div class="section-title"><h3>فوری الرٹس</h3><small>System Monitor</small></div><div class="activity"><i class="bullet"></i><div>ٹینک کی اصل گنجائش اور موجودہ ڈِپ درج کریں<small>ابتدائی سیٹ اپ درکار</small></div></div><div class="activity"><i class="bullet" style="background:var(--amber)"></i><div>نوزل کے ابتدائی میٹر ریڈنگز درج کریں<small>ابتدائی سیٹ اپ درکار</small></div></div><div class="activity"><i class="bullet" style="background:var(--blue)"></i><div>بینک اکاؤنٹ اور کیشئر پروفائل بنائیں<small>ابتدائی سیٹ اپ درکار</small></div></div><div class="activity"><i class="bullet" style="background:var(--red)"></i><div>Hardware Integration ابھی کنیکٹ نہیں<small>مشین ماڈل / پروٹوکول کی تصدیق ضروری</small></div></div></div></div>
<div class="card" style="margin-top:16px"><div class="section-title"><h3>حالیہ نوزل ریڈنگز</h3><button class="btn outline" onclick="setPage('nozzles')">تمام ریکارڈ</button></div>${table(['تاریخ','نوزل','پروڈکٹ','اوپننگ','کلوزنگ','لیٹرز','رقم'],records.nozzles.slice(-5).reverse().map(x=>[x.date,x.nozzle,x.product,x.opening,x.closing,x.litres,money(x.amount)]))}</div>`}
function modulesPage(){return pageHead('تمام ماڈیولز','مکمل ERP میں شامل بنیادی صفحات اور فنکشنز')+`<div class="grid module-grid">${modules.filter(m=>m[1]!=='dashboard').map(m=>`<button class="module-card" onclick="setPage('${m[1]}')"><span class="module-icon">${m[2]}</span><span><b>${m[0]}</b><small>${m[3]}</small></span></button>`).join('')}</div>`}
const configs={
nozzles:{title:'نوزل میٹر ریڈنگ اور سیل',desc:'ہر نوزل کی شفٹ وائز اوپننگ، کلوزنگ، لیٹر اور سیل رقم درج کریں۔',fields:[['date','تاریخ','date'],['nozzle','نوزل نمبر','text'],['product','فیول پروڈکٹ','select:Petrol,HSD,Other'],['opening','اوپننگ میٹر','number'],['closing','کلوزنگ میٹر','number'],['test','ٹیسٹ لیٹرز','number'],['rate','فی لیٹر ریٹ','number'],['cashier','کیشئر','text'],['shift','شفٹ','select:Morning,Evening,Night']],headers:['تاریخ','نوزل','پروڈکٹ','اوپننگ','کلوزنگ','لیٹرز','رقم','کیشئر'],calc:d=>{let litres=Math.max(0,Number(d.closing)-Number(d.opening)-Number(d.test||0));return {litres,amount:litres*Number(d.rate)}}},
tanks:{title:'ٹینک مینجمنٹ / ڈِپ',desc:'ٹینک کی گنجائش، موجودہ مقدار، پانی اور ڈِپ ریڈنگ محفوظ کریں۔',fields:[['date','تاریخ / وقت','datetime-local'],['tank','ٹینک نمبر','text'],['product','فیول','select:Petrol,HSD'],['capacity','کل گنجائش (لیٹر)','number'],['dip','ڈِپ ریڈنگ (mm)','number'],['water','پانی (mm)','number'],['stock','چارٹ کے مطابق اسٹاک (لیٹر)','number'],['entered','درج کرنے والا','text'],['verified','تصدیق کرنے والا','text']],headers:['تاریخ','ٹینک','فیول','گنجائش','ڈِپ mm','پانی mm','اسٹاک L','تصدیق']},
deliveries:{title:'ٹینکر / فیول وصولی',desc:'سپلائر انوائس اور اصل موصول شدہ مقدار کا موازنہ کریں۔',fields:[['date','آمد کی تاریخ','date'],['supplier','سپلائر / OMC','text'],['vehicle','ٹینکر نمبر','text'],['invoice','انوائس نمبر','text'],['product','فیول','select:Petrol,HSD'],['tank','وصولی ٹینک','text'],['invoiceLitres','انوائس لیٹرز','number'],['received','اصل موصول لیٹرز','number'],['rate','خریداری ریٹ','number'],['driver','ڈرائیور','text']],headers:['تاریخ','سپلائر','ٹینکر','انوائس','فیول','ٹینک','انوائس L','وصول L','فرق L','رقم'],calc:d=>({difference:Number(d.received)-Number(d.invoiceLitres),amount:Number(d.received)*Number(d.rate)})},
expenses:{title:'اخراجات مینجمنٹ',desc:'ہر خرچے کے ساتھ رسید، ادائیگی کا طریقہ اور منظوری ریکارڈ کریں۔',fields:[['date','تاریخ','date'],['category','خرچے کی قسم','select:تنخواہ,بجلی,مرمت,جنریٹر,صفائی,ٹرانسپورٹ,آفس,دیگر'],['description','تفصیل','text'],['amount','رقم (روپے)','number'],['method','ادائیگی','select:Cash,Bank,Online'],['paidBy','ادا کرنے والا','text'],['approved','منظور کرنے والا','text']],headers:['تاریخ','قسم','تفصیل','رقم','طریقہ','ادا کرنے والا','منظوری']},
bank:{title:'بینک ڈپازٹ مینجمنٹ',desc:'کیشئر سے بینک تک ہر ڈپازٹ، سلپ اور تصدیق محفوظ کریں۔',fields:[['date','تاریخ','date'],['bankName','بینک کا نام','text'],['account','اکاؤنٹ ٹائٹل / آخری ہندسے','text'],['slip','ڈپازٹ سلپ نمبر','text'],['amount','رقم','number'],['cashier','رقم دینے والا کیشئر','text'],['depositor','بینک میں جمع کروانے والا','text'],['status','تصدیق','select:Pending,Verified']],headers:['تاریخ','بینک','اکاؤنٹ','سلپ نمبر','رقم','کیشئر','جمع کروانے والا','اسٹیٹس']},
customers:{title:'کسٹمر / ادھار مینجمنٹ',desc:'کسٹمر، گاڑی، کریڈٹ حد، ادھار اور وصولی کا ریکارڈ۔',fields:[['name','کسٹمر کا نام','text'],['phone','موبائل نمبر','tel'],['vehicle','گاڑی نمبر','text'],['limit','کریڈٹ حد','number'],['opening','ابتدائی بقایا','number'],['notes','پتہ / نوٹس','text']],headers:['نام','موبائل','گاڑی','کریڈٹ حد','ابتدائی بقایا','نوٹس']},
shifts:{title:'شفٹ مینجمنٹ',desc:'شفٹ اوپننگ، کلوزنگ، ذمہ دار کیشئر اور ہینڈ اوور۔',fields:[['date','تاریخ','date'],['shift','شفٹ','select:Morning,Evening,Night'],['cashier','کیشئر','text'],['openingCash','اوپننگ کیش','number'],['closingCash','کلوزنگ کیش','number'],['openingDip','اوپننگ ڈِپ / اسٹاک','number'],['closingDip','کلوزنگ ڈِپ / اسٹاک','number'],['supervisor','سپروائزر','text'],['status','حالت','select:Open,Closed,Pending Approval']],headers:['تاریخ','شفٹ','کیشئر','اوپننگ کیش','کلوزنگ کیش','اوپننگ اسٹاک','کلوزنگ اسٹاک','سپروائزر','اسٹیٹس']},
staff:{title:'ملازمین / HR',desc:'ملازم پروفائل، عہدہ، تنخواہ اور رابطہ۔',fields:[['name','ملازم کا نام','text'],['role','عہدہ','select:Manager,Cashier,Attendant,Accountant,Security,Other'],['phone','موبائل','tel'],['salary','ماہانہ تنخواہ','number'],['joining','جوائننگ تاریخ','date'],['status','حالت','select:Active,Inactive']],headers:['نام','عہدہ','موبائل','تنخواہ','جوائننگ','حالت']},
inventory:{title:'آئل شاپ / انوینٹری',desc:'لبریکنٹس، آئل، فلٹرز اور دیگر اشیاء کا اسٹاک۔',fields:[['date','تاریخ','date'],['name','پروڈکٹ نام','text'],['sku','SKU / بارکوڈ','text'],['qty','موجودہ مقدار','number'],['purchase','خریداری ریٹ','number'],['sale','فروخت ریٹ','number'],['min','کم از کم اسٹاک','number']],headers:['تاریخ','پروڈکٹ','SKU','مقدار','خریداری ریٹ','فروخت ریٹ','کم اسٹاک']}
};
function openRecord(type){let c=configs[type];if(!c){showToast('اس ماڈیول کا فارم اگلے ڈیولپمنٹ مرحلے میں شامل ہوگا');return}document.getElementById('modalTitle').textContent='نیا ریکارڈ — '+c.title;let fields=c.fields.map(f=>`<div class="field"><label>${f[1]}</label>${f[2].startsWith('select:')?`<select name="${f[0]}">${f[2].slice(7).split(',').map(o=>`<option>${o}</option>`).join('')}</select>`:`<input name="${f[0]}" type="${f[2]}" ${f[2]==='number'?'step="any"':''} ${f[2]==='date'?'value="'+new Date().toISOString().slice(0,10)+'"':''} required>`}</div>`).join('');document.getElementById('modalBody').innerHTML=`<div class="notice">${c.desc}</div><form id="recordForm"><div class="form-grid">${fields}</div><div class="form-actions"><button class="btn" type="submit">ریکارڈ محفوظ کریں</button><button class="btn secondary" type="button" onclick="closeModal()">منسوخ</button></div></form>`;document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(c.calc)Object.assign(d,c.calc(d));(records[type]||(records[type]=[])).push(d);save();closeModal();render();showToast('ریکارڈ کامیابی سے محفوظ ہوگیا')};document.getElementById('modalBg').classList.add('show')}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}
function dataPage(type){let c=configs[type];if(!c)return genericPage(type);let rows=(records[type]||[]).slice().reverse().map(x=>type==='nozzles'?[x.date,x.nozzle,x.product,x.opening,x.closing,x.litres,money(x.amount),x.cashier]:type==='deliveries'?[x.date,x.supplier,x.vehicle,x.invoice,x.product,x.tank,x.invoiceLitres,x.received,x.difference,money(x.amount)]:type==='expenses'?[x.date,x.category,x.description,money(x.amount),x.method,x.paidBy,x.approved]:type==='bank'?[x.date,x.bankName,x.account,x.slip,money(x.amount),x.cashier,x.depositor,`<span class="pill ${x.status==='Verified'?'':'warn'}">${x.status}</span>`]:type==='customers'?[x.name,x.phone,x.vehicle,money(x.limit),money(x.opening),x.notes]:type==='shifts'?[x.date,x.shift,x.cashier,money(x.openingCash),money(x.closingCash),x.openingDip,x.closingDip,x.supervisor,x.status]:type==='staff'?[x.name,x.role,x.phone,money(x.salary),x.joining,x.status]:[x.date,x.name,x.sku,x.qty,money(x.purchase),money(x.sale),x.min]);return pageHead(c.title,c.desc,`<button class="btn" onclick="openRecord('${type}')">＋ نیا ریکارڈ</button><button class="btn secondary" onclick="exportCSV('${type}')">Excel / CSV</button>`)+`<div class="card"><div class="section-title"><h3>ریکارڈ لسٹ</h3><small>${(records[type]||[]).length} اندراجات</small></div>${table(c.headers,rows)}</div>`}
function genericPage(p){let m=modules.find(x=>x[1]===p)||['ماڈیول','', '▦',''];let related=modules.filter(x=>x[1]!==p);return pageHead(m[0],m[3]+' — مکمل ڈیجیٹل ریکارڈ اور کنٹرول',`<button class="btn" onclick="showToast('اس فیچر کے لیے تفصیلی فارم اور بیک اینڈ کنفیگریشن درکار ہے')">＋ نیا ریکارڈ</button>`)+`<div class="notice"><b>ماڈیول کی حیثیت:</b> یہ سنگل فائل پروٹوٹائپ میں نیویگیشن اور بنیادی UI کے طور پر شامل ہے۔ مکمل کاروباری استعمال کے لیے متعلقہ فارم، ڈیٹا بیس، رول پرمیشنز اور منظوری کا ورک فلو بیک اینڈ کے ساتھ فعال کرنا ہوگا۔</div><div class="grid three">${stat('ریکارڈز','—','▤','بیک اینڈ کنکشن درکار')}${stat('اسٹیٹس','Setup','⚙','ابتدائی کنفیگریشن')}${stat('آخری اپڈیٹ','—','◷','ڈیٹا کنکشن کے بعد')}</div><div class="card" style="margin-top:15px"><div class="section-title"><h3>${m[0]} کے ذیلی فنکشنز</h3><small>ماڈیول نیویگیشن</small></div><div class="grid module-grid">${related.slice(0,9).map(x=>`<button class="module-card" onclick="setPage('${x[1]}')"><span class="module-icon">${x[2]}</span><span><b>${x[0]}</b><small>${x[3]}</small></span></button>`).join('')}</div></div>`}
function reports(){let sales=records.nozzles.reduce((a,x)=>a+Number(x.amount||0),0),exp=records.expenses.reduce((a,x)=>a+Number(x.amount||0),0),bank=records.bank.reduce((a,x)=>a+Number(x.amount||0),0);return pageHead('رپورٹس و تجزیات','ریکارڈ شدہ ڈیٹا سے خودکار خلاصہ',`<button class="btn secondary" onclick="window.print()">پرنٹ رپورٹ</button>`)+`<div class="grid stats">${stat('درج شدہ نوزل سیل',money(sales),'⛽')}${stat('بینک ڈپازٹ',money(bank),'▥')}${stat('اخراجات',money(exp),'↘')}${stat('ابتدائی نیٹ فرق',money(sales-exp),'⌁','یہ مکمل اکاؤنٹنگ منافع نہیں')}</div><div class="notice">مکمل منافع کے لیے فیول کی خریداری لاگت، اسٹاک ویلیوایشن، ٹیکس، دیگر آمدنی اور تمام اخراجات درج ہونا ضروری ہیں۔</div><div class="card">${table(['رپورٹ','تفصیل','حالت'],[['Nozzle Sales','نوزل وائز سیل اور لیٹر','<span class="pill">دستیاب</span>'],['Cashier Reconciliation','کیشئر کی وصولی بمقابلہ متوقع کیش','<span class="pill warn">ڈیٹا درکار</span>'],['Tank Reconciliation','متوقع بمقابلہ فزیکل اسٹاک','<span class="pill warn">ڈِپ چارٹ درکار</span>'],['Profit & Loss','خریداری لاگت اور اخراجات سمیت','<span class="pill warn">اکاؤنٹنگ سیٹ اپ درکار</span>'],['Bank Reconciliation','بینک اسٹیٹمنٹ بمقابلہ ڈپازٹس','<span class="pill warn">اسٹیٹمنٹ درکار</span>']])}</div>`}
function website(){return pageHead('پبلک ویب سائٹ','سرور خان فلنگ اسٹیشن کا کسٹمرز کے لیے تعارفی صفحہ',`<button class="btn" onclick="showToast('پبلک ویب سائٹ پبلش کرنے کے لیے ڈومین اور ہوسٹنگ درکار ہے')">ویب سائٹ پبلش کریں</button>`)+`<div class="card" style="padding:0;overflow:hidden"><div style="background:linear-gradient(120deg,#092b24,#087b59);color:white;padding:45px 30px;text-align:center"><div style="font-size:45px">⛽</div><h1>سرور خان فلنگ اسٹیشن</h1><p>مقصود چوک، تحصیل کروڑ، ضلع لیہ</p><span class="pill">Fuel • Service • Convenience</span></div><div style="padding:25px;text-align:center"><h2>ہم سے رابطہ کریں</h2><p class="sub">اپنا فون نمبر، اوقات کار، دستیاب سروسز اور درست نقشہ یہاں شامل کریں۔</p><button class="btn" onclick="showToast('رابطہ نمبر ابھی شامل نہیں کیا گیا')">Call Station</button></div></div>`}
function render(){let el=document.getElementById('content');if(current==='dashboard')el.innerHTML=dash();else if(current==='modules')el.innerHTML=modulesPage();else if(current==='reports'||current==='financeReports'||current==='annual')el.innerHTML=reports();else if(current==='website'||current==='portal'||current==='fleetPortal'||current==='cms')el.innerHTML=website();else if(configs[current])el.innerHTML=dataPage(current);else el.innerHTML=genericPage(current)}
function exportCSV(type){let c=configs[type],data=records[type]||[];if(!data.length){showToast('ایکسپورٹ کے لیے ریکارڈ موجود نہیں');return}let keys=Object.keys(data[0]),csv=[keys.join(','),...data.map(r=>keys.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='sarwar-khan-'+type+'.csv';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){let q=e.target.value.trim().toLowerCase();let found=modules.find(m=>m[0].toLowerCase().includes(q)||m[3].toLowerCase().includes(q));if(found)setPage(found[1]);else showToast('اس نام سے ماڈیول نہیں ملا')}})
render();
</script>
</body></html>
