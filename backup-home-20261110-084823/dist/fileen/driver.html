<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0E3B26">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light">
<title>Fileen Transport — Driver</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2032%2032'%3E%3Cpath%20d%3D'M16%201%2029.5%208.75v14.5L16%2031%202.5%2023.25V8.75z'%20fill%3D'%230E3B26'%2F%3E%3Cpath%20d%3D'M16%203.6%2027.2%2010v12L16%2028.4%204.8%2022V10z'%20fill%3D'none'%20stroke%3D'%23C9A227'%20stroke-width%3D'1.2'%2F%3E%3Cpath%20d%3D'M12.4%209.6h8.2v2.9h-4.9v2.6h4.1v2.9h-4.1v4.5h-3.3z'%20fill%3D'%23E8C56A'%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- A hung font request must never hold the first paint (and the login) back:
     the stylesheet loads off-screen, then swaps in. The system fallback in
     --font-ar / --font-lat is the whole reason this is safe. -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap"></noscript>
<style>
/* =======================================================================
   Frin Pharma × Fileen Transport — design tokens
   Green is structural chrome. Gold is structural accent, never body text.
   ======================================================================= */
:root{
  /* green — anchored near Saudi flag green #165D31, never a large flat field */
  --green-900:#07231A; --green-800:#0E3B26; --green-700:#14482F; --green-600:#1B5A3A;
  --green-500:#165D31; --green-300:#4E8C68; --green-200:#A9C9B4; --green-100:#D9E8DE;

  /* gold — decorative/structural only. --gold is NEVER a text colour on a light face. */
  --gold:#C9A227; --gold-lt:#E8C56A; --gold-dim:#B08D1E; --gold-ink:#7A5C10; --gold-rim:#A5811C;
  --gold-wash:#FAF3DC;

  /* light data faces */
  --face:#FBFAF6; --face-2:#F2F0E7; --face-3:#EAE7DA; --face-line:#DEDCCD;
  --ink:#14231D; --ink-2:#3C4E45; --ink-mute:#67786E;

  /* semantics — teal is reserved for cold chain and may not be used for "info" */
  --ok:#1B6B44; --warn:#9A6318; --bad:#B3261E; --cold:#0F6E6B; --amb:#8A6D3B;

  /* temperature zones */
  --z-chilled:#0F6E6B; --z-ambient:#1B6B44; --z-frozen:#2A5D8C;

  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --press:2px; --extrude:3px;

  --elev-1:0 1px 2px rgba(7,35,26,.16), 0 3px 8px rgba(7,35,26,.09);
  --elev-2:0 2px 3px rgba(7,35,26,.18), 0 8px 18px rgba(7,35,26,.13);
  --elev-3:0 3px 5px rgba(7,35,26,.22), 0 18px 38px rgba(7,35,26,.20);

  --font-ar:"Almarai","Noto Naskh Arabic","Geeza Pro",Tahoma,system-ui,sans-serif;
  --font-lat:"DM Sans","Segoe UI",Tahoma,sans-serif;
  --font-ui:var(--font-ar);
  --nav-h:60px;
}

/* chrome surfaces opt into the dark green face via data attribute */
[data-face=chrome]{
  --face:var(--green-800); --face-2:var(--green-700); --face-3:var(--green-600);
  --ink:#EDF5EF; --ink-2:#C3D6C9; --ink-mute:#93AE9C; --face-line:rgba(201,162,39,.26);
  color:var(--ink);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--font-ar); font-size:14px; color:var(--ink);
  background:var(--green-900); line-height:1.9; /* Arabic needs room for descenders + tashkeel */
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{line-height:1.55; margin:0; font-weight:800; letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14.5px} h4{font-size:13px}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
small{font-size:11px}

/* Operational strings must never be reordered by bidi inside Arabic prose. */
.num,.plate,.waybill,.phone,.short-addr,.temp,.mono{
  font-family:var(--font-lat); font-variant-numeric:tabular-nums;
  direction:ltr; unicode-bidi:isolate;
}
body[data-digit=eastern] .num,body[data-digit=eastern] .plate,body[data-digit=eastern] .temp{
  font-family:var(--font-ar);
}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.muted{color:var(--ink-mute)}
.gold-text{color:var(--gold-ink)}   /* darkened — the only legal gold text */
.row{display:flex;align-items:center;gap:var(--sp-2)}
.row--between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:var(--sp-2)}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.tr{text-align:end}
.center{text-align:center}
.eyebrow{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-mute);font-weight:700}

/* Najdi triangle (Alfuraj) sawtooth — heritage geometry. No flag, no state emblem. */
.alfuraj{
  height:10px; background:repeating-linear-gradient(135deg,var(--gold) 0 2px,transparent 2px 9px);
  opacity:.5; border-radius:2px;
}
.alfuraj--chrome{opacity:.4}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* =======================================================================
   Components — the 3D box, status chips, fields, sheets, tables, nav.
   Every rule uses logical properties so RTL is a true mirror.
   ======================================================================= */

/* ---------- the 3D box: four stacked layers ---------- */
.box{
  position:relative;
  background:linear-gradient(180deg,var(--face),var(--face-2));        /* 1 face */
  border:1px solid var(--face-line);
  border-radius:var(--r-md);
  padding:var(--sp-4);
  box-shadow:var(--elev-1);                                            /* 4 contact shadow */
  transition:transform .12s ease, box-shadow .12s ease;
  color:var(--ink);
}
.box::before{                                                          /* 2 top inner highlight */
  content:""; position:absolute; inset-block-start:1px; inset-inline:var(--r-md);
  height:1px; border-radius:var(--r-md) var(--r-md) 0 0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);
  pointer-events:none;
}
.box::after{                                                           /* 3 extrusion = visible thickness */
  content:""; position:absolute; inset-block-end:calc(var(--extrude) * -1); inset-inline:0;
  height:var(--extrude); border-radius:0 0 var(--r-md) var(--r-md);
  background:var(--gold-rim); opacity:.42;
  transition:height .12s ease;
}
.box--gold::after{opacity:1;background:linear-gradient(180deg,var(--gold-lt),var(--gold-rim))}
.box--gold{border-color:var(--gold-dim)}
.box--chrome{
  --face:var(--green-700); --face-2:var(--green-800);
  --ink:#EDF5EF; --ink-2:#C3D6C9; --ink-mute:#93AE9C; --face-line:rgba(201,162,39,.26);
  box-shadow:var(--elev-2);
}
.box--flat::after{display:none}
.box--flush{border-radius:var(--r-sm)}

/* press: the block sinks and its extrusion compresses */
.box--tap:active,.tap>.box:active,.btn:active,.tabs>button:active{
  transform:translateY(var(--press)); box-shadow:var(--elev-1);
}
.box--tap:active::after,.tap>.box:active::after{
  height:calc(var(--extrude) - var(--press));
  inset-block-end:calc((var(--extrude) - var(--press)) * -1);
}

/* ---------- metrics ---------- */
.metric{display:flex;flex-direction:column;gap:2px}
.metric__l{font-size:11.5px;color:var(--ink-mute);font-weight:700;letter-spacing:.01em}
.metric__v{font-size:27px;font-weight:800;letter-spacing:-.02em;font-family:var(--font-lat);
  font-variant-numeric:tabular-nums;line-height:1.25}
.metric__t{font-size:11px;font-weight:700;color:var(--ok)}
.metric__t--warn{color:var(--warn)}
.metric__t--bad{color:var(--bad)}
.metric__i{
  position:absolute; inset-block-start:var(--sp-3); inset-inline-end:var(--sp-3);
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:rgba(27,107,68,.11); color:var(--ok); font-size:15px; font-weight:800;
}
.box--chrome .metric__i{background:rgba(201,162,39,.16);color:var(--gold-lt)}

/* ---------- status chip: colour + shape + label, never colour alone ---------- */
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:var(--r-pill);
  font-size:11.5px;font-weight:800;line-height:1.5;
  border:1px solid var(--face-line);background:var(--face-2);color:var(--ink-2);
  white-space:nowrap;
}
.chip__i{width:9px;height:9px;flex:none;background:currentColor;display:inline-block}
.chip[data-shape=circle] .chip__i{border-radius:50%}
.chip[data-shape=square] .chip__i{border-radius:2px}
.chip[data-shape=triangle]{clip-path:none}
.chip[data-shape=triangle] .chip__i{
  width:0;height:0;background:transparent;
  border-block-end:9px solid currentColor;border-inline-start:5px solid transparent;
  border-inline-end:5px solid transparent;
}
.chip[data-shape=ring] .chip__i{border-radius:50%;background:transparent;
  box-shadow:inset 0 0 0 2px currentColor}
.chip[data-shape=bar] .chip__i{width:4px;height:11px;border-radius:2px}
.chip--ok{color:var(--ok);border-color:#BFE0CC;background:#E9F6EE}
.chip--wait{color:var(--warn);border-color:#EAD5AC;background:#FBF2E0}
.chip--bad{color:var(--bad);border-color:#F0C4C1;background:#FBEDEC}
.chip--cold{color:var(--cold);border-color:#B9DAD7;background:#E7F4F3}
.chip--gold{color:var(--gold-ink);border-color:var(--gold);background:var(--gold-wash)}
.chip--mute{color:var(--ink-mute);border-color:var(--face-line);background:var(--face-2)}

/* ---------- temperature zone badge ---------- */
.zbadge{
  display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:8px;
  font-size:11px;font-weight:800;color:#fff;border:1px solid transparent;
  white-space:nowrap;
}
.zbadge--chilled{background:var(--z-chilled)}
.zbadge--ambient{background:var(--z-ambient)}
.zbadge--frozen{background:var(--z-frozen)}
.zbadge i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.9)}

/* ---------- plate: real Saudi format, commercial class strip ---------- */
.plate{
  display:inline-flex;flex-direction:column;gap:1px;align-items:center;
  border:1.5px solid #1B3A5C;border-radius:6px;background:#fff;color:#122B44;
  padding:3px 8px 4px;min-width:74px;line-height:1.15;font-family:var(--font-ar);
}
.plate__k{font-size:7px;letter-spacing:.14em;color:#1B3A5C;font-family:var(--font-lat);font-weight:700}
.plate__n{font-size:14px;font-weight:800;direction:ltr;unicode-bidi:isolate}
.plate__s{width:100%;height:3px;border-radius:2px;margin-block-start:2px;background:#1B3A5C}
.plate--commercial .plate__s{background:#1B3A5C}
.plate--private .plate__s{background:#9AA7B4}

/* ---------- demo honesty affordance ---------- */
.demo-tag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:9.5px;font-weight:800;color:var(--gold-ink);
  border:1px dashed var(--gold);border-radius:6px;padding:1px 7px;
  background:var(--gold-wash);line-height:1.6;white-space:nowrap;
}
[data-face=chrome] .demo-tag{background:rgba(201,162,39,.14);color:var(--gold-lt);border-color:var(--gold-lt)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--face-line);background:linear-gradient(180deg,var(--face),var(--face-2));
  color:var(--ink);border-radius:var(--r-sm);padding:11px 15px;
  font-size:13px;font-weight:800;cursor:pointer;position:relative;
  box-shadow:var(--elev-1);transition:transform .1s ease,filter .1s ease,box-shadow .1s ease;
}
.btn::after{content:"";position:absolute;inset-block-end:-2px;inset-inline:6px;height:2px;
  border-radius:2px;background:var(--gold-rim);opacity:.35}
.btn--primary{background:linear-gradient(180deg,var(--green-500),var(--green-700));
  color:#fff;border-color:var(--green-600)}
.btn--primary::after{opacity:.9;height:3px;inset-inline:2px}
.btn--gold{background:linear-gradient(180deg,var(--gold-lt),var(--gold-dim));
  color:#3A2B05;border-color:var(--gold-dim);font-weight:800}
.btn--gold::after{opacity:1;height:3px;inset-inline:2px;background:#6E5208}
.btn--ghost{background:transparent;box-shadow:none;border-color:var(--face-line)}
.btn--ghost::after{display:none}
.btn--danger{background:linear-gradient(180deg,#C4392F,#96191A);color:#fff;border-color:#961A14}
.btn--danger::after{background:#6E1109;opacity:.9;height:3px}
.btn--sm{padding:7px 11px;font-size:11.5px;border-radius:8px}
.btn--full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn--xl{padding:16px;font-size:15px;border-radius:14px}

/* ---------- fields ---------- */
.fld{display:block;margin-block-end:var(--sp-3)}
.fld__l{display:block;font-size:11.5px;font-weight:800;margin-block-end:6px;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{
  width:100%;padding:12px 13px;border-radius:var(--r-sm);
  border:1px solid var(--face-line);background:var(--face);color:var(--ink);
  font-size:14px;line-height:1.5;
}
.fld textarea{min-height:78px;resize:vertical}
.fld input::placeholder,.fld textarea::placeholder{color:var(--ink-mute);opacity:.8}
.fld input:focus-visible,.fld select:focus-visible,.fld textarea:focus-visible,
.btn:focus-visible,.tab:focus-visible,.rail__b:focus-visible{
  outline:2px solid var(--gold);outline-offset:2px
}
.fld[data-bad] input,.fld[data-bad] textarea,.fld[data-bad] select{border-color:var(--bad);background:#FBEDEC}
.fld__e{display:block;font-size:10.5px;font-weight:700;color:var(--bad);margin-block-start:4px;line-height:1.5}
.fld__h{display:block;font-size:10.5px;color:var(--ink-mute);margin-block-start:4px;line-height:1.5}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.pairs--3{grid-template-columns:repeat(3,1fr)}

/* segmented picker (temperature zone, priority, language) */
.seg{display:grid;gap:6px;grid-auto-flow:column;grid-auto-columns:1fr}
.seg>button{
  border:1px solid var(--face-line);background:var(--face);color:var(--ink-2);
  border-radius:var(--r-sm);padding:9px 6px;font-size:11.5px;font-weight:800;cursor:pointer;
  display:flex;flex-direction:column;gap:2px;align-items:center;
}
.seg>button[aria-pressed=true]{border-color:var(--gold);background:var(--gold-wash);color:var(--gold-ink)}

/* ---------- signature pad ---------- */
.sig{position:relative;border:1.5px dashed var(--face-line);border-radius:var(--r-sm);
  background:var(--face);height:150px;overflow:hidden;touch-action:none}
.sig canvas{display:block;width:100%;height:100%;direction:ltr}
.sig__hint{position:absolute;inset-block-start:50%;inset-inline:0;transform:translateY(-50%);
  text-align:center;font-size:11.5px;color:var(--ink-mute);pointer-events:none;line-height:1.7}
.sig[data-filled] .sig__hint{display:none}
.sig__tools{display:flex;gap:8px;margin-block-start:8px}

/* ---------- table ---------- */
.tablewrap{overflow:auto;border-radius:var(--r-md);border:1px solid var(--face-line);background:var(--face)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{
  font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-mute);
  text-align:start;padding:11px 10px;border-block-end:1px solid var(--face-line);
  white-space:nowrap;background:var(--face-2);font-weight:800;
}
.tbl td{padding:12px 10px;border-block-end:1px solid var(--face-line);vertical-align:middle}
.tbl tr:last-child td{border-block-end:0}
.tbl tbody tr{transition:background .1s ease}
.tbl tbody tr[data-href]:hover{background:var(--face-2)}
.tbl--zebra tbody tr:nth-child(even){background:rgba(22,93,49,.035)}
.tbl .actions{display:flex;gap:6px}

/* ---------- lists / rows ---------- */
.rowcard{
  display:flex;flex-direction:column;gap:7px;padding:var(--sp-4);margin-block-end:var(--sp-3);
}
.rowcard__top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px var(--sp-3);font-size:12px}
.kv dt{color:var(--ink-mute);font-weight:700}
.kv dd{margin:0;text-align:end;font-weight:600}
.list__empty{padding:var(--sp-6);text-align:center;color:var(--ink-mute);font-size:12.5px;line-height:1.8}

/* ---------- timeline ---------- */
.timeline{display:flex;flex-direction:column;gap:0;padding-inline-start:6px}
.tl{display:grid;grid-template-columns:26px 1fr;gap:var(--sp-3);padding-block-end:var(--sp-4);position:relative}
.tl::before{content:"";position:absolute;inset-block:22px 0;inset-inline-start:12px;width:2px;
  background:var(--face-line)}
.tl:last-child::before{display:none}
.tl__d{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:var(--green-100);color:var(--ok);font-size:11px;font-weight:800;
  border:1px solid var(--face-line);position:relative;z-index:1}
.tl--now .tl__d{background:var(--gold);color:#3A2B05;border-color:var(--gold-dim)}
.tl--bad .tl__d{background:var(--bad);color:#fff;border-color:var(--bad)}
.tl__b{min-width:0}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,20,14,.62);z-index:40;opacity:0;
  transition:opacity .18s ease;backdrop-filter:blur(2px)}
.scrim[data-open]{opacity:1}
.sheet,.drawer{background:var(--face);box-shadow:var(--elev-3);z-index:50;
  display:flex;flex-direction:column;max-height:100dvh}
.sheet__h,.drawer__h{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);
  padding:var(--sp-4) var(--sp-5);border-block-end:1px solid var(--face-line);position:sticky;
  inset-block-start:0;background:var(--face);z-index:2}
.sheet__b,.drawer__b{padding:var(--sp-5);overflow:auto;flex:1}
.sheet__f,.drawer__f{padding:var(--sp-4) var(--sp-5);border-block-start:1px solid var(--face-line);
  display:flex;gap:var(--sp-2);background:var(--face-2)}
.toast{
  position:fixed;inset-inline:50%;inset-block-end:calc(var(--nav-h) + 22px);transform:translate(-50%,12px);
  background:var(--green-800);color:#EDF5EF;border:1px solid var(--gold-dim);
  border-radius:var(--r-sm);padding:12px 16px;font-size:12.5px;font-weight:700;
  box-shadow:var(--elev-3);z-index:80;opacity:0;transition:opacity .18s ease,transform .18s ease;
  max-width:min(92vw,420px);display:flex;align-items:center;gap:10px;pointer-events:none;
}
.toast[data-open]{opacity:1;transform:translate(-50%,0)}
.toast--bad{background:#7E1912;border-color:#C4392F}
.toast--ok{background:var(--green-600)}
.banner{
  display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);
  font-size:11.5px;line-height:1.7;font-weight:600;border:1px solid;margin-block-end:var(--sp-3);
}
.banner--info{background:#EAF3F2;color:#0B5B58;border-color:#B9DAD7}
.banner--warn{background:#FBF2E0;color:#7C4F12;border-color:#EAD5AC}
.banner--bad{background:#FBEDEC;color:#8E1D17;border-color:#F0C4C1}
.banner--gold{background:var(--gold-wash);color:var(--gold-ink);border-color:var(--gold)}

/* ---------- misc ---------- */
.progress{height:7px;border-radius:var(--r-pill);background:var(--face-3);overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--green-500),var(--green-300));
  border-radius:var(--r-pill)}
.progress--gold>i{background:linear-gradient(90deg,var(--gold-dim),var(--gold-lt))}
.hr{border:0;border-block-start:1px solid var(--face-line);margin:var(--sp-4) 0}
.countdown{font-family:var(--font-lat);font-variant-numeric:tabular-nums;font-weight:800;
  color:var(--gold-ink);direction:ltr;unicode-bidi:isolate}
.offline-dot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}
.offline-dot[data-on]{background:var(--ok)}
/* ---------- the map: one component, two renderers ---------- */
.map-frame{display:flex;flex-direction:column;gap:8px;max-width:880px}
.map-wrap{position:relative;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--face-line);
  background:#E9EFEA;min-height:200px}
/* Tiles need a box with a height of its own; the drawing gets its from the
   viewBox, a live map does not, and a zero-height Leaflet is an empty grey. */
.map-wrap--live{height:min(58dvh,540px);min-height:320px}
.map__foot{display:flex;flex-direction:column;gap:8px}
.map-wrap svg.map{display:block;width:100%;height:100%}
.map__land{fill:#DCE7DD;stroke:none}
.map__land--edge{stroke:var(--green-300);stroke-width:1.1;stroke-linejoin:round}
.map__reg{font-family:var(--font-ar);font-size:8.4px;font-weight:700;fill:var(--ink-mute);
  text-anchor:middle;letter-spacing:.02em}
/* shape before colour: a pin's silhouette is its state, the fill only repeats it */
.m-veh{cursor:pointer;stroke:var(--green-800);stroke-width:1.4;fill:var(--ok)}
.m-veh[data-state=on-delivery]{fill:var(--warn)}
.m-veh[data-state=maintenance]{fill:var(--amb)}
.m-veh[data-state=offline]{fill:#B7C3B9}
.m-veh[data-state=excursion]{fill:var(--bad);stroke:var(--bad)}
.m-veh__ring{fill:none;stroke:var(--green-600);stroke-width:2}
.m-veh--on{stroke:var(--gold-dim);stroke-width:2.4}
.m-stop{fill:var(--green-600);stroke:#E9EFEA;stroke-width:1.2;opacity:.85}
.m-stop[data-href]{cursor:pointer}
.m-route{fill:none;stroke:var(--gold-dim);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:7 6;
  animation:mapflow 1.4s linear infinite}
@keyframes mapflow{to{stroke-dashoffset:-13}}
.leaflet-container .m-route{stroke:var(--gold-dim);stroke-width:3;stroke-dasharray:7 6}
.m-pin--idle svg,.m-pin--transit svg,.m-pin--maintenance svg,.m-pin--offline svg,.m-pin--excursion svg{
  display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.m-pin--idle{color:var(--ok)}
.m-pin--transit{color:var(--warn)}
.m-pin--maintenance{color:var(--amb)}
.m-pin--offline{color:#8FA094}
.m-pin--excursion{color:var(--bad)}
.leaflet-container .m-veh{border-radius:50%}
.leaflet-container .m-veh--on{box-shadow:0 0 0 2.4px var(--gold-dim)}
.map__pick{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap;
  padding:8px var(--sp-3);border-block-start:1px solid var(--face-line);background:var(--face);
  color:var(--ink);font-size:12px}
.map__legend{display:flex;gap:var(--sp-3);flex-wrap:wrap;font-size:10.5px;color:var(--ink-mute);
  margin-block-start:10px;align-items:center}
.map__legend>b{font-weight:800;letter-spacing:.04em}
.map__legend .chip__i{width:9px;height:9px}

/* ---------- login: one authored screen, two layouts ---------- */
.login{display:flex;flex-direction:column;gap:var(--sp-4);max-width:440px;margin:0 auto}
.login__hero{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  padding:22px 18px 20px;border-radius:var(--r-md);
  background:linear-gradient(180deg,var(--green-700),var(--green-800));
  border:1px solid rgba(201,162,39,.28);box-shadow:var(--elev-2);color:#EDF5EF;
}
.login__hero::before{
  content:"";position:absolute;inset-block-start:1px;inset-inline:var(--r-md);height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
}
.login__hero::after{
  content:"";position:absolute;inset-block-end:calc(var(--extrude) * -1);inset-inline:0;height:var(--extrude);
  border-radius:0 0 var(--r-md) var(--r-md);background:linear-gradient(180deg,var(--gold-lt),var(--gold-rim));
}
.login__hero .h1{color:#F3F7F2;font-size:18px;letter-spacing:0}
.login__sub{margin:0;font-size:12px;line-height:1.7;color:#C3D6C9;max-width:36ch}
.login__left{margin:0;font-size:11px;font-weight:700;color:var(--gold-lt)}
.login__side{display:flex;flex-direction:column}
.login__form{display:grid;gap:2px}
.login .btn--xl{margin-block-start:10px}

/* ---------- privacy notice ---------- */
.privacy{max-width:520px;margin:0 auto}

/* ---------- navigation ---------- */
/* The in-cab navigation card: a heading rose, three honest metrics and the
   one-tap hand-off. Every rule is a logical property, so the arrow and the
   numbers mirror with the page and never sit on a physical side. */
.navx{margin-block-start:12px}
.navx__top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.navx__dest{min-width:0}
.navx__name{font-weight:800;font-size:16.5px;line-height:1.35;margin-block-start:2px}
.navx__rose{display:flex;flex-direction:column;align-items:center;gap:5px;flex:0 0 auto}
.navx__arrow{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--gold-rim);color:var(--gold-ink);
  background:radial-gradient(circle at 50% 32%,var(--gold-wash),var(--face));
  transition:transform .5s ease}
.navx__dir{font-size:10.5px;font-weight:800;color:var(--ink-mute)}
.navx__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-block-start:16px}
.navx__m{display:flex;flex-direction:column;gap:2px;min-width:0}
.navx__v{font-size:18px;font-weight:800;font-family:var(--font-lat);letter-spacing:-.01em}
.navx__links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:4px 10px}
@media (max-width:560px){.navx__links{grid-template-columns:1fr}}

/* The pre-trip check: a driver ticks with a thumb, so the row is the target. */
.chkrow{display:flex;align-items:center;gap:10px;padding:10px 2px;font-size:13.5px;color:var(--ink);
  border-block-end:1px solid var(--face-line);cursor:pointer}
.chkrow:last-child{border-block-end:0}
.chkrow input{width:21px;height:21px;flex:0 0 auto;accent-color:var(--green-600)}
.chkrow .ico{color:var(--ok);flex:0 0 auto}

/* Live tracking strip: the plate's last report, readable at a glance. */
.track__head{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.track__who{min-width:0}
.track__name{font-weight:800;font-size:15px;line-height:1.4}
.track__state{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-mute);font-weight:700}
.track__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-block-start:12px}
.track__v{display:block;font-size:18px;font-weight:800;font-family:var(--font-lat);
  letter-spacing:-.01em;margin-block-start:2px}
@media (max-width:420px){.track__grid{grid-template-columns:1fr 1fr}}

/* The boot safety net. It only ever appears when the app could not start, so
   it is allowed to be plain and loud: a person looking at a blank green screen
   needs a sentence, a button and a line to send to support. */
.bootfail{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;
  padding:24px;background:var(--green-900);visibility:visible}
.bootfail__box{max-width:440px;width:100%;background:var(--face);color:var(--ink);
  border:1px solid var(--gold-rim);border-radius:var(--r-lg);
  padding:24px 22px;box-shadow:0 24px 60px rgba(4,20,14,.5)}
.bootfail__t{display:block;font-size:19px;font-weight:800;color:var(--ink)}
.bootfail__p{margin-block-start:8px;font-size:13.5px;color:var(--ink-2);line-height:1.9}
.bootfail__p--en{color:var(--ink-mute);font-size:12.5px}
.bootfail__b{margin-block-start:16px;width:100%;padding:12px 16px;border:0;border-radius:var(--r-pill);
  background:var(--green-600);color:#EDF5EF;font-weight:800;font-size:14px;cursor:pointer}
.bootfail__d{display:block;margin-block-start:12px;color:var(--ink-mute);font-size:10.5px;
  line-height:1.6;word-break:break-word}

/* =======================================================================
   Phone shell — < 768px. Built to disappear inside a WebView: 100dvh,
   safe-area insets, no page scroll behind the shell, bottom tab bar.
   ======================================================================= */
.app{
  display:flex;flex-direction:column;height:100vh;height:100dvh;
  background:var(--green-900);overflow:hidden;position:relative;
}
/* Nothing of an empty shell is worth painting before boot has a screen. */
body[data-ready="0"] .app{visibility:hidden}
.app__head{
  position:sticky;inset-block-start:0;z-index:6;flex:none;
  background:linear-gradient(180deg,var(--green-700),var(--green-800));
  color:#EDF5EF;
  padding:calc(env(safe-area-inset-top) + 10px) var(--sp-4) 14px;
  border-block-end:1px solid rgba(201,162,39,.28);
  box-shadow:0 6px 18px rgba(4,20,14,.28);
}
.app__head .row{min-width:0}
.app__body{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;
  padding:var(--sp-4) var(--sp-4) calc(var(--sp-7) + 84px);
  background:var(--face-2);scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.app__body::-webkit-scrollbar{display:none}

/* bottom tab bar */
.tabs{
  position:fixed;inset-inline:0;inset-block-end:0;z-index:7;
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
  background:var(--green-800);border-block-start:1px solid rgba(201,162,39,.32);
  padding-block:8px calc(env(safe-area-inset-bottom) + 8px);
  box-shadow:0 -6px 22px rgba(4,20,14,.36);
}
.tabs>button{
  border:0;background:none;color:#93AE9C;font:700 10px/1.35 var(--font-ar);
  display:grid;justify-items:center;gap:4px;padding:3px 2px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;position:relative;min-height:44px;
}
.tabs>button svg{width:21px;height:21px}
.tabs>button[aria-current=page]{color:var(--gold-lt)}
.tabs>button[aria-current=page]::after{
  content:"";position:absolute;inset-block-start:0;inset-inline:calc(50% - 12px);width:24px;height:2px;
  border-radius:2px;background:var(--gold);
}
.tabs__badge{
  position:absolute;inset-block-start:0;inset-inline-end:calc(50% - 22px);
  min-width:16px;height:16px;border-radius:9px;background:var(--gold);color:#3A2B05;
  font-size:9px;font-weight:800;display:grid;place-items:center;padding-inline:4px;
}

/* brand mark — a gold monogram inside a Najdi-faceted hexagon.
   Deliberately NOT the flag and NOT the state emblem (Saudi Flag Law Art.16). */
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand__m{width:38px;height:38px;flex:none}
.brand__t{min-width:0}
.brand__t b{display:block;font-size:13.5px;letter-spacing:.02em;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand__t small{display:block;font-size:9px;letter-spacing:.14em;color:#93AE9C;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* phone-only overlays */
.sheet{
  position:fixed;inset-inline:0;inset-block-end:0;border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding-block-end:env(safe-area-inset-bottom);
  transform:translateY(101%);transition:transform .24s cubic-bezier(.2,.85,.25,1);
  width:100%;max-height:90dvh;
}
.sheet[data-open]{transform:none}
.sheet::before{content:"";position:absolute;inset-block-start:7px;inset-inline:calc(50% - 18px);
  width:36px;height:4px;border-radius:4px;background:var(--face-3)}
.drawer{
  position:fixed;inset-block:0;inset-inline-end:0;width:100%;
  transform:translateX(100%);transition:transform .24s ease;
}
html[dir=rtl] .drawer{inset-inline-end:auto;inset-inline-start:0;transform:translateX(-100%)}
.drawer[data-open]{transform:none}

/* tap surfaces */
body{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.tap>.box,.box--tap{cursor:pointer}

@media(max-width:767.98px){
  .rail,.win__strip,.rail__label{display:none!important}
  .win{display:contents}
  .pairs--3{grid-template-columns:1fr 1fr}
  .h1{font-size:20px}
  .box{padding:var(--sp-4)}
  .metric__v{font-size:23px}
  .tbl{font-size:12px}
  .tbl th,.tbl td{padding:10px 8px}
}

/* =======================================================================
   Tablet 768–1079px and window >=1080px. Two authored layouts, not one
   stretched: tablet keeps the phone tab bar with an icon rail; window gets
   the application frame, labelled rail and dense grid.
   ======================================================================= */

/* hide phone chrome once there is room for a rail */
@media(min-width:768px){
  .tabs{display:none}
  /* The rail and the window are the two grid items; the window is a column
     that must be capped, or every screen grows past the viewport and the
     shell's overflow:hidden clips whatever falls below the fold. min-height:0
     is what lets a flex/grid child be shorter than its own content. */
  .app{
    display:grid;
    grid-template-columns:76px minmax(0,1fr);
    grid-template-rows:minmax(0,1fr);
    height:100dvh;
  }
  .win{
    display:flex;flex-direction:column;min-width:0;min-height:0;
    grid-column:2;grid-row:1;
  }
  .app__body{
    flex:1;min-height:0;overflow-y:auto;
    overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .app__body::-webkit-scrollbar{display:none}
  /* The title bar is window-frame chrome; a tablet has no frame to hang it on. */
  .win__strip{display:none}
  .rail{
    grid-column:1;grid-row:1;
    background:var(--green-900);
    padding:var(--sp-3) var(--sp-2);
    display:flex;flex-direction:column;gap:6px;
    border-inline-end:1px solid rgba(201,162,39,.22);
    overflow-y:auto;scrollbar-width:none;
  }
  .rail::-webkit-scrollbar{display:none}
  .rail__b{
    border:0;background:transparent;color:#93AE9C;border-radius:var(--r-sm);
    display:grid;place-items:center;cursor:pointer;position:relative;
    min-height:52px;font-size:17px;
  }
  .rail__b svg{width:20px;height:20px}
  .rail__b[aria-current=page]{background:var(--green-700);color:var(--gold-lt)}
  .rail__b[aria-current=page]::before{
    content:"";position:absolute;inset-block:9px;inset-inline-start:0;width:3px;
    border-radius:0 3px 3px 0;background:var(--gold);
  }
  .rail__b .tip{display:none}
  .rail__label{display:none}
  .rail__foot{display:none}
  .rail__mark{display:grid;place-items:center;padding-block:var(--sp-3) var(--sp-4)}
  .sheet{inset-inline:25%;border-radius:var(--r-lg);max-width:640px;margin-inline:auto;
    inset-block-end:var(--sp-6);width:auto}

  .h-2col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-4)}
  .h-3col{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-4)}
}

@media(min-width:1080px){
  .app{grid-template-columns:236px minmax(0,1fr)}
  .win__strip{
    display:flex;align-items:center;gap:var(--sp-3);flex:none;
    padding:9px var(--sp-5);background:var(--green-800);color:#C3D6C9;
    font-size:11.5px;font-weight:700;
    border-block-end:1px solid rgba(201,162,39,.28);
  }
  .win__strip .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
  .win__strip__t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail{padding:var(--sp-4) var(--sp-3);gap:2px}
  .rail__b{
    min-height:38px;aspect-ratio:auto;display:flex;align-items:center;gap:12px;
    padding-inline:12px;font:700 12.5px/1 var(--font-ar);justify-content:flex-start;
  }
  .rail__b .tip{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail__b svg{width:17px;height:17px;flex:none}
  .rail__label{
    display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:#5F7A68;padding:var(--sp-5) 12px 6px;font-weight:800;
  }
  .rail__foot{margin-block-start:auto;padding:var(--sp-4) 12px;font-size:10.5px;color:#5F7A68;
    line-height:1.8;border-block-start:1px solid rgba(201,162,39,.18)}
  .app__body{padding:var(--sp-5) var(--sp-6) var(--sp-7);background:var(--face-2)}
  .grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--sp-4)}
  .c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
  .c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}
  .c9{grid-column:span 9}.c12{grid-column:1/-1}
  .tbl thead th{position:sticky;inset-block-start:0;z-index:2;background:var(--face-2)}
  .tbl tbody tr:hover{background:var(--face-2)}
  .drawer{
    position:fixed;inset-block:0;inset-inline-end:0;width:min(620px,48vw);
    border-inline-start:1px solid var(--face-line);
    transform:translateX(100%);
  }
  html[dir=rtl] .drawer{inset-inline-end:auto;inset-inline-start:0;transform:translateX(-100%)}
  .drawer[data-open]{transform:none}
  .sheet{inset-inline:calc(50% - 320px);width:640px;inset-block-end:var(--sp-7);
    border-radius:var(--r-lg);max-height:82dvh}
  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);
    margin-block-end:var(--sp-5)}
  .pagehead h1{font-size:25px}
  .metric__v{font-size:29px}
  .split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--sp-4);height:100%}
  .driver-split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
    gap:var(--sp-4);align-items:start}
  .driver-split .map-frame{position:sticky;inset-block-start:0}
}

/* window frame chrome: the "desktop window app" reading the brief asked for */
@media(min-width:1080px){
  body{padding:0;background:var(--green-900)}
  .app{
    margin:0 auto;height:100dvh;border-radius:0;border:0;
  }
  .app__body{border-radius:0}
}

/* the login splits into brand panel + form once there is a window to fill */
@media(min-width:1080px){
  .login{
    display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1fr);gap:var(--sp-7);
    align-items:start;max-width:840px;margin:6dvh auto 0;
  }
  .login__hero{padding:32px 26px 28px}
  .login__hero .h1{font-size:22px}
  .rail__foot{display:block}
}

    eye: "<path d='M2.8 12S6.4 6.2 12 6.2 21.2 12 21.2 12 17.6 17.8 12 17.8 2.8 12 2.8 12z'/><circle cx='12' cy='12' r='2.5'/>",
    doc: "<path d='M6 3.8h7.8l4 4v12.4H6z'/><path d='M13.8 3.8v4h4'/><path d='M8.6 12.6h6.6M8.6 16h4.6'/>",
    print: "<path d='M7 9.4V4.8h10v4.6'/><rect x='4' y='9.4' width='16' height='7.2' rx='1.6'/><path d='M7 14.4h10v4.8H7z'/>",
    lock: "<rect x='5.4' y='10.4' width='13.2' height='9.4' rx='2'/><path d='M8.6 10.4V8.2a3.4 3.4 0 0 1 6.8 0v2.2'/>",
    qr: "<rect x='4' y='4' width='6' height='6' rx='1'/><rect x='14' y='4' width='6' height='6' rx='1'/><rect x='4' y='14' width='6' height='6' rx='1'/><path d='M14 14h2.4v2.4H14zM17.6 17.6h2.4V20h-2.4zM14 20h2.4v-2.4'/>",
    filter: "<path d='M4.6 6.4h14.8l-5.8 6.8v5.4l-3.2-2.2v-3.2z'/>",
    chevron: "<path d='M9.6 6.4 15.2 12l-5.6 5.6'/>",
    wallet: "<rect x='3.6' y='6.6' width='16.8' height='11.8' rx='2'/><path d='M3.6 10.8h16.8'/><circle cx='16.4' cy='14.6' r='1.1'/>",
    building: "<path d='M5.2 20.4V5.6h8.8v14.8M14 9.6h5v10.8'/><path d='M7.6 8.6h4M7.6 11.8h4M7.6 15h4M16 12.8h1.6M16 16.2h1.6'/>",
    copy: "<rect x='8.6' y='8.6' width='11' height='11' rx='2'/><path d='M15.4 5.6H5.6a1.6 1.6 0 0 0-1.6 1.6v9.8'/>",
  };

  function icon(name, opts) {
    const o = opts || {};
    const d = ICONS[name] || ICONS.box;
    const s = o.size || 20;
    return '<svg class="ico' + (o.cls ? ' ' + o.cls : '') + '" viewBox="0 0 24 24" width="' + s + '" height="' + s
      + '" fill="none" stroke="currentColor" stroke-width="' + (o.width || 1.7)
      + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + d + '</svg>';
  }

  /* The only markup parse in the app, so it is the only place an injected
     handler could ever land: every real handler is attached with
     addEventListener, therefore inline on* attributes and javascript: URLs are
     stripped here rather than trusted to each caller. */
  function sanitize(html) {
    return String(html)
      .replace(/\son[a-z]+\s*=\s*"[^"]*"/gi, '')
      .replace(/\son[a-z]+\s*=\s*'[^']*'/gi, '')
      .replace(/\son[a-z]+\s*=\s*[^\s>]+/gi, '')
      .replace(/javascript:/gi, '');
  }

  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = sanitize(html).trim();
    return t.content.firstElementChild;
  }

  /* ---------- the 3D box ---------- */
  function box(o) {
    o = o || {};
    const cls = ['box'];
    if (o.chrome) cls.push('box--chrome');
    if (o.gold) cls.push('box--gold');
    if (o.flat) cls.push('box--flat');
    if (o.flush) cls.push('box--flush');
    if (o.tap || o.href) cls.push('box--tap');
    if (o.cls) cls.push(o.cls);
    let h = '<div class="' + cls.join(' ') + '"' + (o.id ? ' id="' + esc(o.id) + '"' : '')
      + (o.href ? ' data-href="' + esc(o.href) + '"' : '')
      + (o.aria ? ' role="button" tabindex="0" aria-label="' + esc(o.aria) + '"' : '')
      + (o.style ? ' style="' + esc(o.style) + '"' : '') + '>';
    if (o.icon) h += '<span class="metric__i">' + icon(o.icon, { size: 16 }) + '</span>';
    if (o.title) h += '<div class="' + (o.chrome ? 'metric__l' : 'fld__l') + '">' + esc(o.title) + '</div>';
    if (o.value != null) h += '<div class="metric__v">' + o.value + '</div>';
    if (o.trend) h += '<div class="metric__t' + (o.tone ? ' metric__t--' + o.tone : '') + '">' + esc(o.trend) + '</div>';
    if (o.body) h += o.body;
    if (o.hint) h += '<div class="fld__h">' + esc(o.hint) + '</div>';
    if (o.actions) h += '<div class="sheet__f" style="border:0;background:none;padding:12px 0 0">' + o.actions + '</div>';
    return h + '</div>';
  }

  function metric(o) {
    return box({ chrome: o.chrome, gold: o.gold, icon: o.icon, title: o.label, value: o.value,
      trend: o.trend, tone: o.tone, style: o.style });
  }

  /* Colour + shape + label: a status that survives a black-and-white printout
     and a colour-blind dispatcher. */
  function chip(code, opts) {
    const s = FP.data.statusOf(code);
    const o = opts || {};
    return '<span class="chip chip--' + (o.tone || s.tone) + '" data-shape="' + s.shape + '">'
      + '<i class="chip__i" aria-hidden="true"></i>' + esc(FP.t(s.key)) + '</span>';
  }

  /* Anything that is not an order status (a vehicle in maintenance, a logger
     due for calibration) still gets colour + shape + words, same three signals. */
  function pill(key, tone, shape) {
    return '<span class="chip chip--' + (tone || 'mute') + '" data-shape="' + (shape || 'circle') + '">'
      + '<i class="chip__i" aria-hidden="true"></i>' + esc(FP.t(key)) + '</span>';
  }

  function zbadge(zone) {
    const z = FP.ZONES[zone];
    if (!z) return '<span class="chip chip--mute">' + esc(FP.t('fmt.none')) + '</span>';
    return '<span class="zbadge zbadge--' + zone + '"><i aria-hidden="true"></i>'
      + esc(FP.t('temp.' + zone)) + '</span>';
  }

  function plate(v) {
    const p = FP.fmt.plate(v.plate_letters || v.letters, v.plate_nums || v.numbers);
    return '<span class="plate plate--commercial">'
      + '<span class="plate__k">KSA</span>'
      + '<span class="plate__n">' + esc(p.ltr) + '</span>'
      + '<span class="plate__s"></span></span>';
  }

  function kv(pairs) {
    const list = Array.isArray(pairs) ? pairs : [[pairs.k, pairs.v]];
    return '<dl class="kv">' + list.map(pair =>
      '<dt>' + esc(pair[0]) + '</dt><dd>' + (pair[1] == null ? FP.t('fmt.none') : pair[1]) + '</dd>').join('') + '</dl>';
  }

  function btn(o) {
    o = o || {};
    const kind = ['primary', 'gold', 'ghost', 'danger'].indexOf(o.kind) >= 0 ? o.kind : '';
    const cls = ['btn'];
    if (kind) cls.push('btn--' + kind);
    if (o.sm) cls.push('btn--sm');
    if (o.xl) cls.push('btn--xl');
    if (o.full) cls.push('btn--full');
    return '<button type="' + (o.type || 'button') + '" class="' + cls.join(' ') + '"'
      + (o.id ? ' id="' + esc(o.id) + '"' : '')
      + (o.act ? ' data-act="' + esc(o.act) + '"' : '')
      + (o.close ? ' data-close' : '')
      + (o.disabled ? ' disabled' : '')
      + (o.aria ? ' aria-label="' + esc(o.aria) + '"' : '')
      + (o.attrs || '') + '>'
      + (o.icon ? icon(o.icon, { size: o.sm ? 15 : 17 }) : '')
      + '<span>' + esc(o.label || '') + '</span></button>';
  }

  function field(o) {
    o = o || {};
    const id = o.id || 'f-' + o.name;
    const tag = o.tag || 'input';
    const attrs = [
      'id="' + esc(id) + '"', 'name="' + esc(o.name || '') + '"',
      tag === 'input' ? 'type="' + esc(o.type || 'text') + '"' : '',
      o.inputmode ? 'inputmode="' + esc(o.inputmode) + '"' : '',
      o.autocomplete ? 'autocomplete="' + esc(o.autocomplete) + '"' : '',
      o.pattern ? 'pattern="' + esc(o.pattern) + '"' : '',
      o.max ? 'max="' + esc(o.max) + '"' : '',
      o.required ? 'required aria-required="true"' : '',
      o.value != null && tag !== 'textarea' ? 'value="' + esc(o.value) + '"' : '',
      o.attrs || '',
    ].filter(Boolean).join(' ');
    const ctrl = tag === 'select'
      ? '<select ' + attrs + '>' + (o.options || []).map(op =>
        '<option value="' + esc(op.v) + '"' + (String(op.v) === String(o.value) ? ' selected' : '') + '>'
        + esc(op.t) + '</option>').join('') + '</select>'
      : tag === 'textarea'
        ? '<textarea ' + attrs + ' placeholder="' + esc(o.placeholder || '') + '">' + esc(o.value || '') + '</textarea>'
        : '<input ' + attrs + (o.placeholder ? ' placeholder="' + esc(o.placeholder) + '"' : '') + '>';
    return '<label class="fld">'
      + '<span class="fld__l">' + esc(o.label || '') + (o.required ? ' *' : '') + '</span>'
      + ctrl
      + (o.error ? '<span class="fld__e" role="alert">' + esc(o.error) + '</span>'
        : o.hint ? '<span class="fld__h">' + esc(o.hint) + '</span>' : '')
      + '</label>';
  }

  /* Segmented picker: three options, one visible selection, no dropdown to
     mis-tap in a cab. */
  function seg(o) {
    return '<div class="seg" role="group" aria-label="' + esc(o.label || o.name) + '">'
      + o.options.map(op => '<button type="button" data-seg="' + esc(o.name) + '" data-val="' + esc(op.v)
        + '" aria-pressed="' + (String(op.v) === String(o.value) ? 'true' : 'false') + '">'
        + (op.icon ? icon(op.icon, { size: 16 }) : '')
        + '<span>' + esc(op.t) + '</span>'
        + (op.sub ? '<small class="fld__h">' + esc(op.sub) + '</small>' : '')
        + '</button>').join('') + '</div>';
  }

  function banner(o) {
    o = o || {};
    const tone = o.tone || 'info';
    const ic = o.icon || (tone === 'info' ? 'eye' : tone === 'gold' ? 'shield' : 'alert');
    return '<div class="banner banner--' + tone + '" role="note">' + icon(ic, { size: 17 })
      + '<div><b>' + esc(o.title || '') + '</b>' + (o.text ? '<div>' + esc(o.text) + '</div>' : o.body || '')
      + '</div></div>';
  }

  function demoTag() {
    return '<span class="demo-tag" title="' + esc(FP.t('ui.demo_hint')) + '">'
      + icon('shield', { size: 10, width: 2 }) + esc(FP.t('ui.demo_tag')) + '</span>';
  }

  function progress(pct, gold) {
    const p = Math.max(0, Math.min(100, Number(pct) || 0));
    return '<div class="progress' + (gold ? ' progress--gold' : '') + '" role="progressbar" aria-valuenow="'
      + Math.round(p) + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + p + '%"></i></div>';
  }

  function table(o) {
    const cols = o.cols || [];
    const head = '<thead><tr>' + cols.map(c => '<th>' + esc(c.t) + '</th>').join('') + '</tr></thead>';
    const body = (o.rows || []).map(r => '<tr' + (r.href ? ' data-href="' + esc(r.href) + '"' : '') + '>'
      + r.cells.map(c => '<td>' + (c == null ? FP.t('fmt.none') : c) + '</td>').join('') + '</tr>').join('');
    return '<div class="tablewrap"><table class="tbl' + (o.zebra === false ? '' : ' tbl--zebra') + '">'
      + head + '<tbody>' + (body || '<tr><td colspan="' + cols.length + '"><div class="list__empty">'
        + esc(FP.t('common.empty')) + '</div></td></tr>') + '</tbody></table></div>';
  }

  function rowcard(o) {
    return '<div class="box rowcard"' + (o.href ? ' data-href="' + esc(o.href) + '"' : '') + '>'
      + '<div class="rowcard__top"><div style="min-width:0">'
      + '<div style="font-weight:800;font-size:13.5px">' + (o.title || '') + '</div>'
      + (o.sub ? '<div class="fld__h" style="margin-block-start:2px">' + o.sub + '</div>' : '')
      + '</div>' + (o.right || '') + '</div>'
      + (o.body || '')
      + (o.actions ? '<div class="sheet__f" style="border:0;background:none;padding:8px 0 0">' + o.actions + '</div>' : '')
      + '</div>';
  }

  /* The event trail is the audit record made visible: kind drives the dot, and
     a breach is never allowed to look like an ordinary step. */
  function timeline(events) {
    return '<div class="timeline">' + (events || []).map((e, i, all) => {
      const bad = e.tone === 'bad', now = i === all.length - 1;
      const title = e.title || (e.note && /^(st|rd|err)\./.test(e.note) ? FP.t(e.note) : e.kind || '');
      return '<div class="tl' + (now ? ' tl--now' : '') + (bad ? ' tl--bad' : '') + '">'
        + '<div class="tl__d">' + icon(e.icon || (bad ? 'alert' : 'check'), { size: 13, width: 2 }) + '</div>'
        + '<div class="tl__b"><div style="font-weight:700;font-size:12.5px">' + esc(title) + '</div>'
        + '<div class="fld__h">' + esc(FP.fmt.dateTime(e.at))
        + (e.actor ? ' · ' + esc(FP.t('common.by')) + ' ' + esc(e.actor) : '') + '</div>'
        + (e.body || '') + '</div></div>';
    }).join('') + '</div>';
  }

  function empty(o) {
    o = o || {};
    return '<div class="box box--flat"><div class="list__empty">'
      + icon(o.icon || 'list', { size: 26 })
      + '<div style="margin-block-start:10px">' + esc(o.text || FP.t('common.empty')) + '</div>'
      + (o.hint ? '<div class="fld__h">' + esc(o.hint) + '</div>' : '')
      + (o.action || '') + '</div></div>';
  }

  function loading() {
    return '<div class="box box--flat"><div class="list__empty">'
      + '<div style="max-width:220px;margin-inline:auto">' + progress(38, true)
      + '<div style="margin-block-start:12px">' + esc(FP.t('common.loading')) + '</div></div></div></div>';
  }

  function head(o) {
    return '<div class="pagehead"><div><h1 class="h1" style="margin:0;font-size:21px;line-height:1.3">'
      + esc(o.title) + '</h1>'
      + (o.sub ? '<div class="fld__h" style="font-size:12px">' + esc(o.sub) + '</div>' : '')
      + '</div>' + (o.actions ? '<div style="display:flex;gap:8px;flex-wrap:wrap">' + o.actions + '</div>' : '')
      + '</div>';
  }

  /* ---------- overlays ---------- */
  let scrim = null;
  const layers = [];

  function ensureScrim() {
    if (!scrim) {
      scrim = el('<div class="scrim" aria-hidden="true"></div>');
      document.body.appendChild(scrim);
      scrim.addEventListener('click', () => {
        const top = layers[layers.length - 1];
        if (top) top.close();
      });
    }
    return scrim;
  }
  function syncScrim() {
    const s = ensureScrim();
    if (layers.length) s.setAttribute('data-open', '1');
    else s.removeAttribute('data-open');
  }

  function panel(kind, o) {
    const node = el('<div class="' + kind + '" role="dialog" aria-modal="true" aria-label="'
      + esc(o.title == null ? '' : o.title) + '">'
      + (o.closable === false ? '' : '<div class="' + kind + '__h"><b>'
        + (o.title == null ? '' : esc(o.title)) + '</b>'
        + '<button type="button" class="btn btn--ghost btn--sm" data-close aria-label="'
        + esc(FP.t('common.close')) + '">' + icon('x', { size: 15 }) + '</button></div>')
      + '<div class="' + kind + '__b">' + (o.body || '') + '</div>'
      + (o.actions ? '<div class="' + kind + '__f">' + o.actions + '</div>' : '')
      + '</div>');
    const back = g.document ? g.document.activeElement : null;
    const layer = {
      node,
      close() {
        if (layers.indexOf(layer) < 0) return;
        layers.splice(layers.indexOf(layer), 1);
        node.remove();
        syncScrim();
        if (back && back.focus) back.focus();
        if (o.onClose) o.onClose();
      },
    };
    node.addEventListener('click', e => { if (e.target.closest('[data-close]')) layer.close(); });
    document.body.appendChild(node);
    layers.push(layer);
    syncScrim();
    const first = node.querySelector('input,select,textarea,button:not([data-close])');
    if (first) first.focus();
    return layer;
  }

  function sheet(o) { return panel('sheet', o || {}); }
  function drawer(o) { return panel('drawer', o || {}); }

  function confirm(o) {
    o = o || {};
    return new Promise(resolve => {
      let answered = false;
      const layer = sheet({
        title: o.title == null ? FP.t('common.confirm') : o.title,
        body: '<p style="margin:0;font-size:13.5px;line-height:1.7">' + (o.body || '') + '</p>',
        actions: btn({ label: o.cancel || FP.t('common.cancel'), kind: 'ghost', close: true })
          + btn({ label: o.confirm || FP.t('common.yes'), kind: o.tone === 'danger' ? 'danger' : 'primary' }),
        onClose: () => { if (!answered) resolve(false); },
      });
      const yes = layer.node.querySelector('.sheet__f .btn:last-child');
      yes.addEventListener('click', () => { answered = true; layer.close(); resolve(true); });
    });
  }

  let toastNode = null, toastTimer = null;
  function toast(msg, kind) {
    if (toastNode) { toastNode.remove(); clearTimeout(toastTimer); }
    toastNode = el('<div class="toast' + (kind ? ' toast--' + kind : '') + '" role="status" aria-live="polite">'
      + icon(kind === 'bad' ? 'alert' : 'check', { size: 16 }) + '<span>' + esc(msg) + '</span></div>');
    document.body.appendChild(toastNode);
    g.requestAnimationFrame(() => { if (toastNode) toastNode.setAttribute('data-open', '1'); });
    toastTimer = setTimeout(() => {
      const n = toastNode;
      toastNode = null;
      if (n) { n.removeAttribute('data-open'); setTimeout(() => n.remove(), 220); }
    }, 2800);
    return toastNode;
  }

  /* ---------- signature pad ----------
     The POD signature is a legal artefact in KSA, so the pad must export a real
     image, survive a page re-render, and draw in canvas coordinates: the page
     is RTL around it, never mirrored inside it. */
  const INK = () => (g.getComputedStyle
    ? (g.getComputedStyle(document.documentElement).getPropertyValue('--ink') || '#14231D').trim()
    : '#14231D');

  function makePad(node) {
    const dpr = Math.max(1, (g.devicePixelRatio || 1));
    let canvas = node.querySelector('canvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      node.appendChild(canvas);
    }
    if (!node.querySelector('.sig__hint')) {
      node.appendChild(el('<div class="sig__hint">' + esc(FP.t('ui.sig_hint')) + '</div>'));
    }
    const ctx = canvas.getContext('2d');
    const pad = { node, canvas, ctx, strokes: [], active: null, dpr };

    function fit() {
      const w = node.clientWidth || 300, h = node.clientHeight || 150;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = INK();
      redraw();
    }
    function redraw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pad.strokes.forEach(s => draw(s));
    }
    function draw(stroke) {
      if (!stroke.length) return;
      ctx.beginPath();
      ctx.moveTo(stroke[0].x, stroke[0].y);
      for (let i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i].x, stroke[i].y);
      ctx.stroke();
    }
    function at(ev) {
      const r = canvas.getBoundingClientRect();
      const t = (ev.touches && ev.touches[0]) || (ev.changedTouches && ev.changedTouches[0]) || ev;
      return { x: t.clientX - r.left, y: t.clientY - r.top };
    }

    pad.stroke = function (points) {
      const s = (points || []).map(p => ({ x: p.x, y: p.y }));
      if (s.length < 2) return pad.strokes;
      pad.strokes.push(s);
      draw(s);
      node.setAttribute('data-filled', '1');
      return pad.strokes;
    };
    pad.isEmpty = () => !pad.strokes.some(s => s.length > 2);
    pad.clear = function () {
      pad.strokes = [];
      node.removeAttribute('data-filled');
      redraw();
    };
    pad.toDataURL = (type) => {
      // A pad with nothing on it must not pretend to be a signature.
      if (pad.isEmpty()) return '';
      const out = document.createElement('canvas');
      out.width = canvas.width; out.height = canvas.height;
      const c2 = out.getContext('2d');
      c2.fillStyle = '#FFFFFF';
      c2.fillRect(0, 0, out.width, out.height);
      c2.drawImage(canvas, 0, 0);
      return out.toDataURL(type || 'image/png');
    };

    canvas.addEventListener('pointerdown', e => {
      canvas.setPointerCapture(e.pointerId);
      pad.active = [at(e)];
    });
    canvas.addEventListener('pointermove', e => {
      if (!pad.active) return;
      const p = at(e);
      pad.active.push(p);
      const from = pad.active[pad.active.length - 2];
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    });
    const end = () => {
      if (!pad.active) return;
      const pts = pad.active;
      pad.active = null;
      pad.stroke(pts);
    };
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    if (g.ResizeObserver) new g.ResizeObserver(fit).observe(node);
    else g.addEventListener('resize', fit);
    fit();
    return pad;
  }

  const mounted = new WeakMap();
  FP.sig = {
    mount(node) {
      if (!node) return null;
      // A screen re-render replaces the node; the pad follows the node, not the
      // id, so a signature already on the page is never drawn onto a new canvas.
      if (!mounted.has(node) || !g.document.contains(node)) mounted.set(node, makePad(node));
      return mounted.get(node);
    },
    unmount(node) { mounted.delete(node); },
  };

  /* Gold monogram inside a Najdi-faceted hexagon. Not the flag, not the palm
     and swords: Saudi Flag Law art. 16/20 reserves those to the state. */
  function mark(size) {
    const s = size || 38;
    return '<svg class="brand__m" viewBox="0 0 32 32" width="' + s + '" height="' + s + '" aria-hidden="true">'
      + "<path d='M16 1 29.5 8.75v14.5L16 31 2.5 23.25V8.75z' fill='var(--green-800)'/>"
      + "<path d='M16 3.6 27.2 10v12L16 28.4 4.8 22V10z' fill='none' stroke='var(--gold)' stroke-width='1.2'/>"
      + "<path d='M12.4 9.6h8.2v2.9h-4.9v2.6h4.1v2.9h-4.1v4.5h-3.3z' fill='var(--gold-lt)'/></svg>";
  }

  function brand(o) {
    o = o || {};

       the role's home once, where the guard can take over. */
    if (!s) { go(FP.role.home, { replace: true }); return; }
    leaveScreen(route.id);
    const html = s.render ? s.render(route.params) : '';
    view.innerHTML = '<section class="page" id="page-' + esc(route.id) + '">'
      + (s.head === false ? '' : '') + html + '</section>';
    document.body.setAttribute('data-screen', route.id);
    document.getElementById('app').setAttribute('data-screen', route.id);
    view.scrollTop = 0;

    const h = document.querySelector('.app__head');
    if (h) h.outerHTML = head();
    const st = document.querySelector('.win__strip');
    if (st) st.outerHTML = strip();

  function paintNav() {
    const tabs = document.querySelector('nav.' + 'tabs');
    if (tabs) tabs.replaceWith(el(nav('tabs')));
    const rail = document.querySelector('nav.' + 'rail');
    if (rail) rail.replaceWith(el(nav('rail')));

  function el(html) { return FP.ui.el(html); }

  /* ---------- wiring ---------- */
  function onClick(root) {
    root.addEventListener('click', e => {
      const nav1 = e.target.closest('[data-nav]');
      if (nav1) { go(nav1.dataset.nav); return; }
      /* A control inside a tappable row must win over the row's navigation:
         the dispatcher pressed "assign", not "open". */
      const act = e.target.closest('[data-act]');
      if (act) { run(act.dataset.act, act); return; }
      const link = e.target.closest('[data-href]');
      if (link) { go(link.dataset.href.replace(/^#\/?/, ''), { params: paramsOf(link) }); return; }
      const seg1 = e.target.closest('[data-seg]');
      if (seg1) {
        const group = seg1.closest('.seg');
        group.querySelectorAll('[data-seg]').forEach(b => b.setAttribute('aria-pressed', 'false'));

          detail: { name: seg1.dataset.seg, value: seg1.dataset.val } }));

      if (e.key !== 'Enter' && e.key !== ' ') return;
      const b = e.target.closest('[data-href][role="button"],.box--tap[role="button"]');

    });

  function paramsOf(node) {
    const cut = (node.dataset.href || '').indexOf('?');
    if (cut < 0) return {};
    const out = {};
    node.dataset.href.slice(cut + 1).split('&').filter(Boolean).forEach(p => {
      const kv = p.split('='); out[kv[0]] = decodeURIComponent(kv[1] || '');
    });
    return out;
  }

  function run(act, node) {
    if (act === 'lang') { FP.app.toggleLang(); return; }
    if (act === 'logout') { FP.auth.logout(); return; }
    if (act === 'login') { submitLogin(node); return; }
    if (act === 'coords') { copyCoords(node && node.dataset ? node.dataset.coords : ''); return; }
    const s = FP.role.screens[route.id];
    if (s && s.on) s.on(act, node, route.params);
  }

  /* Clipboard is the one hand the app cannot promise: a WebView without the
     permission still has the coordinates on the screen, and has to be told. */
  function copyCoords(text) {
    if (!text) return;
    const done = ok => FP.ui.toast(FP.t(ok ? 'nav.copied' : 'nav.copy_failed'), ok ? 'ok' : 'warn');
    if (g.navigator && g.navigator.clipboard && g.navigator.clipboard.writeText) {
      g.navigator.clipboard.writeText(text).then(() => done(true), () => done(false));

    const r = FP.auth.login(FP.role.id, creds);
    if (!r.ok) { paintLogin(r.error); return; }

  }

    const view = document.getElementById('view');
    if (!view) return;
    const keep = collectForm();
    view.innerHTML = loginScreen(code);

  function collectForm() {
    const out = {};

    return out;
  }
  function restoreForm(keep) {

      const i = document.querySelector('form.login__form [name="' + n + '"]');

    catch (e) { return fallback; }
  }

    opts = opts || {};

       eastern toggle is a reader preference, never a data change. */

  function rerender() {
    if (!FP.role) return;

    if (t) t.textContent = titleFor(route.id);
  }

  let tick = null;

    boot() {
      const d = g.document;

         mount — runs below. If any of it throws, the shell must still become
         visible and the person must be told, not left staring at the dark-green
         <body> the phone shell paints behind itself. */
      try {
        d.getElementById('app').outerHTML = '<div id="app" class="app">'
          + nav('rail') + '<div class="win">' + strip() + head()
          + '<main class="app__body" id="view" tabindex="-1"></main></div>' + nav('tabs') + '</div>';
        d.body.setAttribute('data-role', FP.role.id);
        onClick(d.body);
        window.addEventListener('hashchange', () => {
          const next = parse();
          if (next.id !== route.id || JSON.stringify(next.params) !== JSON.stringify(route.params)) {

        d.body.setAttribute('data-ready', '1');

        try { g.console.error('FP boot failed', e); } catch (e2) { /* console may be absent */ }

    screenTitle: () => titleFor(route.id),
    setDigit(mode) {

   card, the document radar and the head-office switches.

   builder that returns markup plus the overlays that collect a signature, a
   temperature or a reason. Nothing here writes to the bus except through the
   small `commit*` helpers at the bottom, so the state machine stays the only
   thing that decides whether a move is legal.

    const dest = o.recipient && o.recipient.geo ? o.recipient.geo : null;
    const live = TRACK_LIVE.indexOf(o.status) >= 0;

    const km = live && origin && dest ? FP.nav.dist(origin, dest) : null;
    const eta = km != null ? FP.nav.etaMin(km) : null;

    let h = FP.ui.box({ title: T('track.title'), body:
      (v || d
        ? '<div class="track__head">'
          + '<div class="track__who"><div class="track__name">'

          + '<div class="fld__h">' + (v ? FP.ui.plate(v) : esc(T('track.no_vehicle'))) + '</div></div>'
          + '<div class="track__state">' + (d && d.on_duty
            ? '<span class="offline-dot" data-on></span>' + esc(T('track.live', {
              t: d.last_geo_at ? FP.fmt.time(new Date(d.last_geo_at)) : T('fmt.none') }))
            : '<span class="offline-dot"></span>' + esc(T('track.stale'))) + '</div>'
          + '</div>'
        : '<p class="fld__h">' + esc(T('track.unassigned')) + '</p>')
      + (km != null
        ? '<div class="track__grid">'
          + '<div><span class="metric__l">' + esc(T('track.remaining')) + '</span><span class="track__v">'
          + FP.fmt.km(km) + '</span></div>'
          + '<div><span class="metric__l">' + esc(T('track.eta')) + '</span><span class="track__v">'
          + FP.fmt.duration(eta * 60000) + '</span></div>'
          + '<div><span class="metric__l">' + esc(T('track.arrive')) + '</span><span class="track__v">'
          + FP.fmt.time(new Date(Date.now() + eta * 60000)) + '</span></div>'
          + '</div>'
        : ''),
    });
    h += '<div class="map-frame" style="margin-block:12px"><div class="map-wrap" id="order-map"></div></div>';
    return h;
  }

  function orderMapAfter(view, id) {
    const node = view.querySelector('#order-map');
    if (!node) return;
    const o = FP.bus.order(id);
    if (!o) return;
    const v = o.vehicle_id ? FP.bus.vehicle(o.vehicle_id) : null;
    const dest = o.recipient && o.recipient.geo ? o.recipient.geo : null;
    const live = TRACK_LIVE.indexOf(o.status) >= 0;
    const origin = live ? trackOrigin(o) : null;
    const map = FP.map.mount(node, {
      mode: 'orders',
      vehicles: v ? [v] : [],
      stops: () => { const x = FP.bus.order(id); return x && x.recipient ? [x] : []; },
    });
    if (!map || !map.node) return;
    /* Fit once per (order, leg). A dispatcher who pans away must not be dragged
       back every time the plate reports a new point. */
    const key = id + ':' + (live ? 'live' : 'still');
    if (map.node.__trackKey === key) {
      if (live && origin && dest) map.route([origin, dest]);
      return;
    }
    map.node.__trackKey = key;
    if (live && origin && dest) {
      map.route([origin, dest]);
      map.fit([origin, dest]);
      if (map.impl && map.impl.kind === 'svg') map.centerOn(FP.nav.advance(origin, dest, 0.5));
    } else if (dest) {
      map.centerOn(dest);
    } else if (v) {
      map.centerOn(FP.map.placeOf(v));
    }
  }

  /* The driver's own copy of that map: the leg from where they are to the door
     the load must reach. It is the same geometry the navigate screen ticks. */
  function jobMapAfter(view, id) {
    const node = view.querySelector('#job-map');
    if (!node) return;
    const o = FP.bus.order(id);
    if (!o) return;
    const s = FP.auth.session('driver');
    const me = s && s.driver_id ? FP.bus.driver(s.driver_id) : null;
    const dest = navDestination(o);
    const origin = navOrigin(o, me);
    const map = FP.map.mount(node, { mode: 'me', vehicles: [] });
    if (!map || !map.node || !dest.geo) return;
    map.route([origin, dest.geo]);
    const key = o.id + ':' + dest.kind;
    if (map.node.__jobKey === key) return;
    map.node.__jobKey = key;
    map.fit([origin, dest.geo]);
    if (map.impl && map.impl.kind === 'svg') map.centerOn(FP.nav.advance(origin, dest.geo, 0.5));
  }

  /* ---------- the new-order form (company) ---------- */
  /* The storage zone is a property of the goods, not a free choice: a shipment
     carrying insulin is a chilled shipment whatever the picker says. The form
     still exposes the picker, but selecting a product moves it to the coldest
     line so an ambient order can never quietly carry a cold-chain medicine. */
  function coldestZone(skus) {
    const rank = { ambient: 1, chilled: 2, frozen: 3 };
    let best = null;
    (skus || []).forEach(sku => {
      const p = D().PRODUCTS.find(x => x[0] === sku);
      if (p && (best == null || rank[p[3]] > rank[best])) best = p[3];
    });
    return best;
  }

  /* Reads the form back into the draft so a re-render (add/remove a line or a
     language switch) never throws away what was typed. */
  function collectNew() {
    const form = document.getElementById('page-new') || document;
    const val = n => { const i = form.querySelector('[name="' + n + '"]'); return i ? i.value : ''; };
    const seg = n => { const b = form.querySelector('[data-seg="' + n + '"][aria-pressed="true"]'); return b ? b.dataset.val : null; };
    if (seg('zone')) newDraft.zone = seg('zone');
    if (seg('priority')) newDraft.priority = seg('priority');
    newDraft.recipient = Number(val('recipient')) || 0;
    newDraft.promise = Number(val('promise')) || 24;
    newDraft.lines = newDraft.lines.map((_, i) => ({
      sku: val('sku-' + i), lot: val('lot-' + i), expiry: val('expiry-' + i),
      qty: Number(val('qty-' + i)) || 0, weight: Number(val('weight-' + i)) || 0,
    }));
    return newDraft;
  }

  function submitNew() {
    const d = collectNew();
    for (let i = 0; i < d.lines.length; i++) {
      const chk = FP.valid.line(d.lines[i]);
      if (!chk.ok) { FP.ui.toast(T('new.invalid'), 'bad'); return null; }
    }
    if (!FP.valid.zone(d.zone)) { FP.ui.toast(T('new.invalid'), 'bad'); return null; }
    const p = D().PHARMACIES[d.recipient] || D().PHARMACIES[0];
    const lines = d.lines.map(l => {
      const prod = D().PRODUCTS.find(x => x[0] === l.sku) || D().PRODUCTS[0];
      return { sku: prod[0], product: { ar: prod[1], en: prod[2] }, lot: l.lot, expiry: l.expiry,
        qty: l.qty, weight_kg: l.weight, barcode: '628' + String(10000000 + d.recipient) };
    });
    const r = FP.bus.create({
      actor: 'frin', zone: d.zone, priority: d.priority, promise_hours: d.promise,
      invoice: 'INV-' + Date.now().toString().slice(-6),
      recipient: { name: p.en, name_ar: p.ar, org: p.en, building: p.address.building,
        street: p.address.street, district: p.address.district, city: p.address.city_en,
        city_ar: p.address.city, postcode: p.address.postcode, short: p.address.short, phone: p.phone, geo: p.geo },
      lines,
    });
    resetNew();
    FP.ui.toast(T('new.created', { w: FP.fmt.waybill(r.order.waybill) }), 'ok');
    return r.order;
  }

        + '" style="width:56px;height:42px;object-fit:cover;border-radius:6px;border:1px solid var(--face-line)">').join('');

  /* ---------- navigation ----------
     The screen a driver lands on the moment a job is accepted. It is not a
     turn-by-turn engine — the research is explicit that rebuilding one is a
     trap — it is an honest remaining distance, an arrival clock, a heading and
     one tap into the maps app the driver already trusts. When the device has a
     location fix that is in the Kingdom it is followed; otherwise a
     deterministic simulation walks the leg so the demo never sits still. */
  function activeJob(driver) {
    if (!driver) return null;
    return FP.bus.read().orders.find(o => o.driver_id === driver.id
      && ['accepted', 'at_pickup', 'pickup_confirmed', 'in_transit', 'out_for_delivery'].includes(o.status)) || null;
  }
  function navDestination(o) {
    const pickup = ['accepted', 'at_pickup'].indexOf(o.status) >= 0;
    if (pickup) {
      const wh = D().WAREHOUSES.find(w => w.id === (o.shipper && o.shipper.warehouse_id)) || D().WAREHOUSES[0];
      return { geo: wh.geo, kind: 'pickup', name: FP.lang === 'ar' ? wh.ar : wh.en,
        city: FP.lang === 'ar' ? FP.geo(wh.city).ar : wh.city };
    }
    const to = o.recipient || {};
    return { geo: to.geo || null, kind: 'drop',
      name: FP.lang === 'ar' ? (to.name_ar || to.name) : to.name, city: to.city_ar || to.city || '' };
  }
  function navOrigin(o, me) {
    if (me && FP.nav.inSaudi(me.last_geo)) return me.last_geo;
    const dest = navDestination(o);
    const wh = D().WAREHOUSES.find(w => w.id === (o.shipper && o.shipper.warehouse_id)) || D().WAREHOUSES[0];
    if (dest.kind === 'drop') return wh.geo;
    /* The pickup leg starts a short hop out of the yard so the approach has a
       distance to count down from; it is a drawing, and it says so. */
    return { lat: wh.geo.lat - 0.14, lng: wh.geo.lng + 0.11 };
  }

  const navLive = { key: null, timer: null, gps: null, leg: null, pos: null, map: null,
    t: 0, ticks: 0, mode: 'sim', me: null, o: null };
  function navSet(id, val) {
    const el = document.getElementById(id);
    if (el && el.textContent !== val) el.textContent = val;
  }
  function navPaint() {
    if (!navLive.leg) return;
    const dest = navLive.leg.dest;
    const from = navLive.pos || navLive.leg.origin;
    const remain = FP.nav.dist(from, dest);
    const eta = FP.nav.etaMin(remain);
    const bear = FP.nav.bearing(from, dest);
    navSet('nav-dist', FP.fmt.km(remain));
    navSet('nav-eta', FP.fmt.duration(eta * 60000));
    navSet('nav-arrive', FP.fmt.time(new Date(Date.now() + eta * 60000)));
    navSet('nav-dir', FP.t(FP.nav.compassKey(bear)));
    const view = document.getElementById('page-navigate');
    const arrow = view && view.querySelector('#nav-arrow');
    if (arrow) arrow.style.transform = 'rotate(' + Math.round(bear) + 'deg)';
    if (navLive.map) navLive.map.route([from, dest]);
  }
  function navStop() {
    if (navLive.timer) { clearInterval(navLive.timer); navLive.timer = null; }
    if (navLive.gps) { clearInterval(navLive.gps); navLive.gps = null; }
    navLive.key = null;
  }
  function navGps() {
    const geo = g.navigator && g.navigator.geolocation;
    if (!geo) return;
    const sample = () => { try {
      geo.getCurrentPosition(p => {
        const pt = { lat: p.coords.latitude, lng: p.coords.longitude };
        if (FP.nav.inSaudi(pt)) { navLive.mode = 'gps'; navLive.pos = pt; navSet('nav-mode', FP.t('navx.gps_note')); navPaint(); }
      }, () => {}, { enableHighAccuracy: true, timeout: 6000, maximumAge: 4000 });
    } catch (e) { /* a browser without the permission keeps the simulation */ } };
    sample();
    navLive.gps = setInterval(sample, 8000);
  }
  function navTick() {
    if (!FP.router || FP.router.current().id !== 'navigate') { navStop(); return; }
    if (!navLive.leg) return;
    navLive.ticks++;
    if (navLive.mode !== 'gps') {
      navLive.t = Math.min(1, navLive.t + 1 / 45);
      navLive.pos = FP.nav.advance(navLive.leg.origin, navLive.leg.dest, navLive.t);
    }
    navPaint();
    /* Feed the shared bus a point about every ten seconds: enough for the
       head-office map to draw the plate moving, rare enough not to repaint the
       three apps in a loop. */
    if (navLive.me && navLive.pos && navLive.ticks % 10 === 0) FP.bus.setDriverGeo(navLive.me.id, navLive.pos, 'driver');
  }
  function navigateAfter() {
    const s = FP.auth.session('driver');
    const me = s && s.driver_id ? FP.bus.driver(s.driver_id) : null;
    const id = FP.router.current().params.id;
    const o = (id ? FP.bus.order(id) : null) || activeJob(me);
    const view = document.getElementById('page-navigate');
    if (!me || !o || !view) return;
    const dest = navDestination(o);
    const origin = navOrigin(o, me);
    const key = o.id + ':' + dest.kind;
    const fresh = navLive.key !== key;
    if (fresh) {
      navStop();
      navLive.key = key; navLive.leg = FP.nav.leg(origin, dest.geo || origin);
      navLive.t = 0; navLive.pos = navLive.leg.origin; navLive.ticks = 0; navLive.mode = 'sim';
      if (dest.geo) navGps();
    } else {
      navLive.leg = FP.nav.leg(origin, dest.geo || origin);
    }
    navLive.me = me; navLive.o = o;
    navLive.map = FP.map.mount(view.querySelector('#nav-map'), { mode: 'me', vehicles: [] });
    /* Frame the leg once, when it is set: re-fitting on every tick would fight
       a driver who has panned away to look at the road ahead. */
    if (navLive.map && fresh) navLive.map.fit([navLive.leg.origin, navLive.leg.dest]);
    navPaint();
    if (!navLive.timer) navLive.timer = setInterval(navTick, 1000);
  }

  function navigateScreen(o, me) {
    const dest = navDestination(o);
    const leg = FP.nav.leg(navOrigin(o, me), dest.geo || navOrigin(o, me));
    const cold = o.zone !== 'ambient';
    const ex = FP.bus.excursion(o);
    const moves = legalMoves(o, 'driver');
    const primary = moves[0];
    let h = FP.ui.head({
      title: T('nav.navigate'), sub: iso(FP.fmt.waybill(o.waybill)),
      actions: FP.ui.btn({ kind: 'ghost', icon: 'chevron', label: T('common.back'), act: 'back' }),
    });

    h += '<div class="navx box box--chrome">'
      + '<div class="navx__top"><div class="navx__dest">'
      + '<span class="metric__l">' + esc(dest.kind === 'pickup' ? T('navx.pickup') : T('navx.drop')) + '</span>'
      + '<div class="navx__name">' + esc(dest.name || '') + '</div>'
      + '<div class="fld__h">' + esc(dest.city || '') + '</div></div>'
      + '<div class="navx__rose" aria-hidden="true">'
      + '<div class="navx__arrow" id="nav-arrow">' + FP.ui.icon('route', { size: 26 }) + '</div>'
      + '<div class="navx__dir" id="nav-dir">' + esc(T(leg.heading)) + '</div></div></div>'
      + '<div class="navx__grid">'
      + '<div class="navx__m"><span class="metric__l">' + esc(T('navx.distance')) + '</span><span class="navx__v" id="nav-dist">' + FP.fmt.km(leg.km) + '</span></div>'
      + '<div class="navx__m"><span class="metric__l">' + esc(T('navx.eta')) + '</span><span class="navx__v" id="nav-eta">' + FP.fmt.duration(leg.eta * 60000) + '</span></div>'
      + '<div class="navx__m"><span class="metric__l">' + esc(T('navx.arrive')) + '</span><span class="navx__v" id="nav-arrive">' + FP.fmt.time(new Date(Date.now() + leg.eta * 60000)) + '</span></div>'
      + '</div>'
      + '<div class="fld__h" id="nav-mode">' + esc(T('navx.sim_note')) + '</div>'
      + '</div>';

    if (ex) h += FP.ui.banner({ tone: 'bad', icon: 'temp', title: T('job.excursion_hold'), text: T('cold.rp_hold') });
    if (o.status === 'quarantined') h += FP.ui.banner({ tone: 'bad', icon: 'shield', title: T('job.quarantined'), text: T('cold.rp_hold') });

    if (dest.geo) {
      const u = FP.nav.to(dest.geo, dest.name);
      h += '<div class="box box--flat" style="margin-block-start:12px">'
        + '<div class="fld__l">' + esc(T('navx.handoff')) + '</div>'
        + '<div class="navx__links">'
        + '<a class="btn btn--primary" href="' + u.gmaps + '" target="_blank" rel="noopener noreferrer">'
        + FP.ui.icon('pin', { size: 17 }) + '<span>' + esc(T('nav.google')) + '</span></a>'
        + '<a class="btn btn--ghost" href="' + u.waze + '" target="_blank" rel="noopener noreferrer">'
        + FP.ui.icon('pin', { size: 17 }) + '<span>' + esc(T('nav.waze')) + '</span></a>'
        + '<a class="btn btn--ghost" href="' + u.ios + '" target="_blank" rel="noopener noreferrer">'
        + FP.ui.icon('pin', { size: 17 }) + '<span>' + esc(T('nav.apple')) + '</span></a>'
        + '</div>'
        + FP.ui.btn({ kind: 'ghost', full: true, icon: 'copy', label: T('nav.copy'), act: 'coords',
          attrs: ' data-coords="' + esc(u.copy) + '"' })
        + '</div>';
    }

    h += '<div class="map-frame" style="margin-block-start:12px"><div class="map-wrap" id="nav-map"></div></div>';

    if (primary) {
      h += '<div class="sheet__f" style="border:0;background:none;padding:16px 0 0;flex-wrap:wrap">'
        + FP.ui.btn({ kind: primary.kind || 'primary', icon: primary.icon, label: T(primary.label), xl: true,
          act: primary.pod ? 'deliver' : primary.attempt ? 'attempt' : 'move',
          attrs: primary.pod || primary.attempt ? '' : ' data-to="' + primary.to + '"' })
        + FP.ui.btn({ kind: 'ghost', icon: 'doc', label: T('navx.open_job'), act: 'open-job' })
        + FP.ui.btn({ kind: 'ghost', icon: 'alert', label: T('inc.report'), act: 'incident' })
        + '</div>';
    }
    h += FPGA_PAD(cold);
    h += FP.ui.btn({ kind: 'danger', full: true, icon: 'alert', label: T('inc.sos'), act: 'sos' });
    return h;
  }
  /* A breath of space before the emergency control so it is never one fat
     thumb away from the button above it. */
