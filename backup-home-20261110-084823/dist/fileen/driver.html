  /* ---------- incident / SOS ---------- */
  function incidentSheet(onDone) {
    const layer = FP.ui.sheet({
      title: T('inc.title'),
      body: '<p class="fld__h" style="font-size:11.5px;line-height:1.7">' + esc(T('inc.sub')) + '</p>'
        + FP.ui.field({ tag: 'select', name: 'inc_type', label: T('inc.type'), required: true,
          options: D().INCIDENT_TYPES.map(x => ({ v: x.code, t: T(x.key) })) })
        + FP.ui.field({ tag: 'select', name: 'inc_sev', label: T('inc.severity'), value: 'normal',
          options: D().SEVERITIES.map(x => ({ v: x.code, t: T(x.key) })) })
        + FP.ui.field({ tag: 'textarea', name: 'inc_note', label: T('inc.note') }),
      actions: FP.ui.btn({ kind: 'ghost', label: T('common.cancel'), close: true })
        + FP.ui.btn({ kind: 'danger', icon: 'alert', label: T('inc.submit'), id: 'inc-send' }),

  function jobOn(act, node, id) {
    const d = me();
    if (!d) return;
    const o = id ? FP.bus.order(id) : null;
    if (act === 'move') {
      const to = node.dataset.to;
      /* Taking custody of a cold load is a record, not a tap: the seal and the
         load temperature are captured at the door before the state moves. */
      if (to === 'pickup_confirmed' && o) {
        FP.screens.custodySheet(o, payload => {
          const r = FP.bus.transition(o.id, to, payload, 'driver');
          FP.ui.toast(FP.t(r.ok ? 'job.moved' : r.error), r.ok ? 'ok' : 'bad');
        });
        return;
      }
      if (!o) return;
      const r = FP.bus.transition(o.id, to, {}, 'driver');
      FP.ui.toast(FP.t(r.ok ? 'job.moved' : r.error), r.ok ? 'ok' : 'bad');
      return;
    }
    /* An incident and an SOS are the same record with a louder flag; both are

    if (act === 'incident' || act === 'sos') {

      FP.screens.incidentSheet(p => {
        FP.bus.incident({
          order_id: o ? o.id : null, driver_id: d.id, vehicle_id: d.vehicle_id,
          type: p.type, severity: sos ? 'high' : p.severity, note: p.note,
          geo: d.last_geo || null, sos,
        }, 'driver');
        FP.ui.toast(FP.t('inc.sent'), 'ok');
      });
      return;
    }
    if (!o) return;
    if (act === 'read-temp') {
      FP.screens.readingSheet(o, c => {
        const r = FP.bus.reading(o.id, c, 'driver');
        FP.ui.toast(FP.t(r.breach ? 'job.temp_bad' : 'job.temp_ok'), r.breach ? 'bad' : 'ok');
      });
      return;
    }
    if (act === 'deliver') {
      FP.screens.podSheet(o, pod => {
        const r = FP.bus.transition(o.id, 'delivered', { pod }, 'driver');
        const after = FP.bus.order(o.id);
        if (r.ok) FP.ui.toast(FP.t('job.delivered_ok'), 'ok');
        else if (after && after.status === 'quarantined') FP.ui.toast(FP.t('job.quarantined'), 'bad');
        else FP.ui.toast(FP.t(r.error), 'bad');
      });
      return;
    }
    if (act === 'attempt') {

                + '</div>',
            })
            + (mine.length ? '<h2 class="h2" style="margin:18px 0 10px">' + esc(FP.t('jobs.mine')) + '</h2>'
              + mine.map(jobCard).join('') : '')
            + '<h2 class="h2" style="margin:18px 0 10px">' + esc(FP.t('jobs.pool')) + '</h2>'
            + (d.on_duty ? (offers().map(jobCard).join('')
              || FP.ui.empty({ icon: 'check', text: FP.t('jobs.none') }))
              : FP.ui.empty({ icon: 'lock', text: FP.t('jobs.off_duty'), hint: FP.t('jobs.off_duty_hint') }));
        },
        on(act, node) {
          const d = me();
          if (!d) return;
          if (act === 'duty') {
            if (d.on_duty) {
              FP.bus.endShift(d.id, {}, 'driver');
              FP.ui.toast(FP.t('duty.ended'), 'ok');
            } else {
              /* Going on duty is a pre-trip check, not a switch: send the driver
                 to the shift screen where the checklist and odometer live. */
              FP.router.go('shift');
            }
            return;
          }
          const id = node && node.dataset && node.dataset.id;
          if (act === 'offer' && id) {
            const r = FP.bus.transition(id, 'accepted', { driver_id: d.id }, 'driver');
            FP.ui.toast(FP.t(r.ok ? 'job.accepted' : r.error), r.ok ? 'ok' : 'bad');
            /* Accepting is the moment the driver starts moving: the nav screen
               opens on the spot rather than waiting for another tap. */
            if (r.ok) FP.router.go('navigate', { params: { id } });
          }
          if (act === 'pass' && id) FP.router.go('jobs');
        },
      },
      navigate: {
        title: 'nav.navigate',
        render() {
          const d = me();
          if (!d) return FP.ui.empty({ text: FP.t('auth.no_session') });
          const pid = FP.router.current().params.id;
          const o = (pid ? FP.bus.order(pid) : null) || FP.screens.activeJob(d);
          if (!o) return FP.ui.head({ title: FP.t('nav.navigate') })
            + FP.ui.empty({ icon: 'route', text: FP.t('navx.no_job') });
          return FP.screens.navigateScreen(o, d);
        },
        after() { FP.screens.navigateAfter(); },
        leave() { FP.screens.navLeave(); },
        on(act, node) {
          const d = me();
          if (!d) return;
          const pid = FP.router.current().params.id;
          const o = (pid ? FP.bus.order(pid) : null) || FP.screens.activeJob(d);
          if (act === 'back') { FP.router.go('jobs'); return; }
          if (act === 'open-job') { if (o) FP.router.go('job', { params: { id: o.id } }); return; }
          jobOn(act, node, o ? o.id : null);
        },
      },
      shift: {
        title: 'nav.shift',
        render() {
          const d = me();
          if (!d) return FP.ui.empty({ text: FP.t('auth.no_session') });
          return FP.screens.shiftPanel(d);
        },
        on(act) {
          const d = me();
          if (!d) return;
          const view = document.getElementById('page-shift');
          if (act === 'start-shift') {
            const r = FP.bus.startShift(d.id, FP.screens.collectShift(view), 'driver');
            if (r.ok) { FP.ui.toast(FP.t('duty.started'), 'ok'); FP.app.render(); }
            else FP.ui.toast(FP.t(r.error || 'shift.need_checks'), 'bad');
            return;
          }
          if (act === 'end-shift') {
            const odo = view && view.querySelector('[name="odo_end"]');
            const note = view && view.querySelector('[name="shift_note"]');
            FP.bus.endShift(d.id, { odometer: odo && odo.value, note: note && note.value }, 'driver');
            FP.ui.toast(FP.t('duty.ended'), 'ok');
            FP.app.render();
          }
        },
      },
      privacy: {
        title: 'auth.privacy_title',
        render() { return FP.auth.privacyScreen(); },
        on(act) {
          if (act === 'consent-accept') { FP.auth.acceptConsent(); FP.ui.toast(FP.t('duty.consent_ok'), 'ok'); }
          if (act === 'consent-decline') FP.auth.declineConsent();
        },
      },
      job: {
        title: 'job.title',
        render(params) {
          const d = me();
          const o = FP.bus.order(params.id);
          if (!d) return FP.ui.empty({ text: FP.t('auth.no_session') });
          if (!o) return FP.ui.head({ title: FP.t('job.title') })
            + FP.ui.empty({ icon: 'box', text: FP.t('err.order_not_found') });
          return FP.screens.jobDetail(o, d);
        },
        after(view) { FP.screens.jobMapAfter(view, FP.router.current().params.id); },
        on(act, node, params) {
          const id = params.id;
          if (act === 'back') { FP.router.go('jobs'); return; }
          if (act === 'navigate') { FP.router.go('navigate', { params: { id } }); return; }
          jobOn(act, node, id);
        },
      },
      map: {
        title: 'nav.map',
        render() {
          const d = me();
          const v = d ? FP.bus.vehicle(d.vehicle_id) : null;
          const job = d ? FP.bus.read().orders.find(o => o.driver_id === d.id
            && ['accepted', 'at_pickup', 'pickup_confirmed', 'in_transit', 'out_for_delivery'].includes(o.status)) : null;
          return FP.ui.head({ title: FP.t('nav.map'), sub: FP.t('map.hint') })
            + '<div class="map-frame"><div class="map-wrap" id="driver-map"></div></div>'
            + (job ? '<div style="display:grid;gap:10px;margin-block-start:12px">'
              + FP.ui.rowcard({
                title: FP.fmt.isolate(job.waybill, 'waybill') + ' ' + FP.ui.chip(job.status),
                sub: FP.t('ord.promise') + ' ' + FP.fmt.date(job.promised_at),
              })
              + navTo(job) + '</div>' : '');
        },
        after(view) {
          const d = me();
          const m = FP.map.mount(view.querySelector('#driver-map'), {
            mode: 'me', onlyVehicleId: d ? d.vehicle_id : null,
          });
          const job = d ? FP.bus.read().orders.find(o => o.driver_id === d.id
            && ['in_transit', 'out_for_delivery'].includes(o.status)) : null;
          if (job && job.recipient && job.recipient.geo && d && d.vehicle_id) {
            const v = FP.bus.vehicle(d.vehicle_id);
            m.route([FP.map.placeOf(v), job.recipient.geo]);
          }
        },
      },
      me: {
        title: 'nav.me',
        render() {
          const d = me();
          const v = d ? FP.bus.vehicle(d.vehicle_id) : null;
          return FP.ui.head({ title: FP.t('nav.me') })
            + FP.ui.kv([
              [FP.t('me.name'), esc(d ? (FP.lang === 'ar' ? d.ar : d.en) : '')],
              [FP.t('me.iqama'), d ? FP.fmt.isolate(d.iqama) : ''],
              [FP.t('me.licence'), esc(FP.t('lic.' + (d ? d.licence_class : 'professional')))],
              [FP.t('me.licence_expiry'), d ? FP.fmt.date(d.licence_expiry) : ''],
              [FP.t('me.card'), d ? FP.fmt.isolate(d.transport_card) : ''],
              [FP.t('me.consent'), d && d.consent ? FP.t('me.consent_yes') : FP.t('me.consent_no')],
              [FP.t('me.vehicle'), v ? FP.ui.plate(v) : ''],
              [FP.t('me.rating'), d ? FP.fmt.pct(d.rating / 5 * 100) + ' · ' + FP.fmt.digits(d.completed) : ''],
            ])
            + FP.ui.box({ title: FP.t('me.zones'), body: v ? v.zones.map(z => FP.ui.zbadge(z)).join(' ') : '' })
            + FP.ui.btn({ kind: 'ghost', full: true, icon: 'pin', label: FP.t('nav.map'), act: 'go-map' })
            + FP.ui.btn({ kind: 'ghost', full: true, icon: 'route', label: FP.t('nav.navigate'), act: 'go-nav' })
            + FP.ui.btn({ kind: 'ghost', full: true, icon: 'logout', label: FP.t('auth.sign_out'), act: 'logout' });
        },
        on(act) {
          if (act === 'go-map') { FP.router.go('map'); return; }
          if (act === 'go-nav') { FP.router.go('navigate'); }
        },
      },
    },
  };
  FP.app.boot();
})(globalThis);

</script>
</body>
</html>
